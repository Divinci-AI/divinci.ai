[[incident]]
date = "2026-08-16"
title = "Internal logging misconfiguration flooded our error counts"
severity = "major_outage"
window = "intermittent through the day"
resolved = true
areas = ["internal"]
summary = """
This day reads as our worst on record and was not an outage at all. An internal \
logging component had been sending its output to an address that was never \
configured to exist, so every attempt failed. Because the failures were \
counted as server errors on the same zone the status monitor watches, a busy \
processing day produced roughly 26,000 of them and repeatedly pushed this page \
into "Major outage". Internal tooling accounted for about 91% of the errors and \
the product for about 1%.

Customers were not affected at any point during this day. The component had \
been failing silently since it was written: the failure looked like a \
successful request to the code making it, so nothing ever reported it.

The misdirected logging has been disabled, and the published history for this \
day has been corrected. We have also recorded that the underlying monitor \
counts our whole zone rather than only customer-facing surfaces, which is what \
allowed an internal fault to be published as a customer-facing outage.
"""

