# Human-authored incident notes for /status.
#
# WHY THIS FILE EXISTS
# The incident list on /status is DERIVED from recorded uptime samples, which
# is deliberate — a hand-maintained list can drift from what the bars show.
# But derived data can only say "degraded, 98.1%". It cannot say what broke,
# who it affected, or whether it is fixed. That is what visitors actually want
# from a status page, and it has to be written by a human.
#
# It also covers a real blind spot. History sampling is driven by /api/status
# TRAFFIC (see recordSample() in src/worker.js), so an outage during a
# low-traffic window can go completely unrecorded — the 2026-08-02 incident
# below happened overnight and the page recorded "operational / 100%" for that
# day. A note here surfaces the incident regardless of whether sampling caught
# it.
#
# ⚠️ YOU NO LONGER HAVE TO WRITE ONE FOR THE PAGE TO SAY SOMETHING.
# Since 2026-08-26 the Worker attributes each bad day automatically, from the
# hosts and paths the errors actually landed on (src/status-attribution.mjs),
# and publishes a note saying WHAT was affected and by how much — at the time,
# with no deploy. That was the gap this file could never close: it is written
# after the fact, so every day was a featureless amber block until somebody
# got round to it, and the days nobody did stayed blocks forever.
#
# So the division of labour is now:
#   - automatic: which areas, what share of the errors, how long, and whether
#     the product was among them. Counting can establish all of that.
#   - this file: WHY it happened and what we changed. Counting can never
#     establish either, and a machine guessing at cause on a public status
#     page is worse than saying nothing.
#
# A note here still REPLACES the automatic one for its date and still wins on
# `areas` — it was written by someone who knew what happened, and it can name
# an area the error counts never saw. Write one whenever the cause is known
# and worth publishing; the page is no longer blank without it.
#
# HOW TO ADD ONE
#   - `date` must be YYYY-MM-DD (UTC) and is what a note is keyed on. Use the
#     day the impact STARTED; add a second entry if it spans days.
#   - `severity` is one of: degraded | partial_outage | major_outage
#   - `resolved = false` renders the entry as ongoing.
#   - Keep `summary` plain and factual. This is a public page: no internal
#     hostnames, customer names, revision IDs, or stack traces.
#   - Newest first is not required; the template sorts by date descending.
#
# Adding a note requires a site deploy (`zola build` + `wrangler deploy`),
# which is fine — these are written after the fact, not live during an
# incident.

# ⚠️ 2026-09-17: SIXTEEN NOTES WERE REMOVED, on purpose.
# They described days rated degraded before the rating stopped counting
# Cloudflare's own Early Hints / prefetch requests and single-client scanner
# bursts. Replaying every one of those days under the current rules
# (scripts/rerate-status-history.mjs) cleared all of them — the highest
# customer-facing count in any of their bad samples was 33 against a threshold
# of 150 — so the notes were explaining degradation that the record no longer
# shows, and the page surfaces any noted day as an incident. They remain in
# git history if the wording is ever wanted. Only 2026-08-02 remains: two real product outages that an error
# count cannot see, kept as recorded.

[[incident]]
date = "2026-08-02"
title = "API requests timed out during two deploys"
severity = "partial_outage"
window = "00:22–00:30 and 00:52–00:58 PT (07:22–07:58 UTC)"
resolved = true
areas = ["product"]
summary = """
Two deployments left incoming API requests waiting on a newly started server \
that had not yet been marked ready to receive traffic. Rather than failing \
quickly, those requests were held open until they timed out. Chat embeds \
could not load during the two windows, and the platform API was unavailable \
for roughly eight minutes and then six minutes.

Service recovered on its own in both cases. We have changed how a new server \
reports readiness so traffic is routed within seconds instead of minutes, \
added a short time limit to the affected public endpoints so a request fails \
fast instead of hanging, and shortened our alerting window so we are paged \
during an incident rather than after it.

This page did not reflect the incident while it was happening: uptime samples \
are collected as visitors load the site, and there was almost no traffic at \
that hour. We are addressing that separately.
"""

[[incident]]
date = "2026-08-02"
title = "Chat and API unavailable — database connection limit reached"
severity = "major_outage"
window = "02:05–02:45 PT (09:05–09:45 UTC)"
resolved = true
areas = ["product"]
summary = """
Our caching layer reached its maximum number of simultaneous connections and \
began refusing new ones. Because the API opens a connection as each server \
starts, and no new connection could be made, the service could not recover by \
adding capacity. Chat and the API were unavailable for roughly forty minutes. \
Static health checks continued to pass throughout, which is why this took \
longer to identify than it should have.

The immediate cause was that connections were not being released when servers \
shut down, so they accumulated over time until the limit was reached. Earlier \
deployments that day accelerated this by cycling servers rapidly.

We have quadrupled the connection limit, enabled data persistence, and — the \
actual fix — changed the API to close its connections on shutdown so they can \
no longer accumulate. We have also added monitoring on connection usage so we \
are warned hours before this threshold could be approached again, rather than \
learning about it from an outage.
"""
