{% extends "base.html" %}

{% block body_class %}feature-page-template{% endblock %}

{# Preload the hero poster image so the browser fetches it during HTML parsing
   rather than waiting until it sees the <video poster=""> tag. External URLs
   pass through untouched; local paths are routed through Cloudflare Image
   Resizing to compress large PNGs to ~150KB WebP. #}
{% block extra_head %}
{% if page.extra.hero_poster %}
  {% if page.extra.hero_poster is starting_with("http") %}
<link rel="preload" as="image" href="{{ page.extra.hero_poster }}" fetchpriority="high">
  {% else %}
<link rel="preload" as="image" href="/cdn-cgi/image/width=1200,format=auto,quality=82/{{ page.extra.hero_poster | trim_start_matches(pat='/') }}" fetchpriority="high">
  {% endif %}
{% endif %}
{% endblock %}

{% block content %}
{# current_lang is inherited from base template #}


<!-- Full-width content without restrictions for feature pages -->
<main class="feature-page leonardo-bg">
    {# Ensure every feature.html-templated page has an H1 for SEO. Hidden visually
       so it doesn't disturb pages that handle their own visual hero (api.md
       embeds Redoc, autorag etc. have full design sections). Screen readers
       still announce it; crawlers still index it. Override with a `.feature-h1`
       rule per-page if you want it visible. #}
    <h1 class="feature-h1 sr-only">{{ page.title | default(value=section.title | default(value=config.title)) }}</h1>
    {{ page.content | safe }}
</main>

<style>
/* Screen-reader-only utility — used by the feature-page H1 above and any
   other a11y/SEO-only headings. */
.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}
</style>


<style>
/* Feature page specific styles - full width, no content restrictions */
.feature-page {
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 0;
}

.feature-page .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem;
}

.feature-page h1, .feature-page h2, .feature-page h3, .feature-page h4, .feature-page h5, .feature-page h6 {
    margin-top: 0;
    margin-bottom: 1rem;
}

.feature-page p {
    margin-bottom: 1rem;
    line-height: 1.6;
}

.feature-page ul, .feature-page ol {
    margin-bottom: 1rem;
    padding-left: 2rem;
}

.feature-page li {
    margin-bottom: 0.5rem;
}

.feature-page a {
    color: var(--color-neutral-inverse);
    text-decoration: none;
}

.feature-page a:hover {
    color: var(--color-accent-tertiary);
    text-decoration: underline;
}

/* Ensure proper spacing for custom sections */
.feature-page section {
    width: 100%;
    margin: 0;
    padding: 0;
}

/* Desktop responsive adjustments */
@media (max-width: 768px) {
    .feature-page .container {
        padding: 0 1rem;
    }
    
    .hero-animation-container {
        width: 300px !important;
        height: 300px !important;
    }
    
    .benefits-circle-container {
        width: 400px !important;
        height: 400px !important;
    }
    
    .desktop-only {
        display: none !important;
    }
}
</style>
{% endblock %}

{% block extra_scripts %}
{% if page.path is containing("api") %}
<!-- Redoc is ~886KB; defer it so it downloads in parallel with parsing and
     executes only after parsing completes. This removes ~900ms of TBT on /api/
     pages (HubSpot SEO recommendation). The init handler now runs on
     DOMContentLoaded, by which point the deferred script has executed and
     window.Redoc is defined. -->
<script defer src="{{ get_url(path="js/redoc.standalone.js") }}"></script>
<script>
{# Defer the Redoc init until after window.load + the browser is idle. This
   slides the expensive OpenAPI-spec parse out of the page's TBT window
   so user input remains responsive. requestIdleCallback yields back to
   user-input handlers between tasks; setTimeout(1000) is the fallback
   for browsers without it (Safari). #}
function _scheduleRedocInit() {
  var run = function initRedoc() {
  if (typeof Redoc !== 'undefined' && document.getElementById('redoc-container')) {
    // openapi-v1.json is auto-generated from the Express route definitions by
    // workspace/servers/public-api/scripts/generate-openapi.ts in the server
    // repo — every path + method is guaranteed to match the shipped API.
    // The legacy hand-maintained openapi.yaml is still served at /openapi.yaml
    // for reference but no longer drives the render.
    Redoc.init('/openapi-v1.json', {
      scrollYOffset: 0,
      hideDownloadButton: false,
      expandResponses: '200',
      nativeScrollbars: true,
      theme: {
        colors: { primary: { main: '#2d5a4f' } },
        typography: {
          fontSize: '15px',
          fontFamily: 'Source Sans 3, sans-serif',
          headings: { fontFamily: 'Fraunces, serif', fontWeight: '400' },
          code: { fontSize: '13px', fontFamily: 'monospace' }
        },
        sidebar: { backgroundColor: '#f8f4f0', textColor: '#2d3c34' },
        rightPanel: { backgroundColor: '#1e3a2b' },
        menu: { backgroundColor: '#f8f4f0' }
      }
    }, document.getElementById('redoc-container'));

    // Make sidebar sticky after Redoc renders
    function fixRedocSidebar() {
      var wrap = document.querySelector('.redoc-wrap');
      if (!wrap) { setTimeout(fixRedocSidebar, 500); return; }

      var sidebar = wrap.children[0];
      if (!sidebar || sidebar.offsetWidth > 400) { setTimeout(fixRedocSidebar, 500); return; }

      // Key: align-items must be flex-start so sidebar doesn't stretch to full height
      wrap.style.alignItems = 'flex-start';

      sidebar.style.position = 'sticky';
      sidebar.style.top = '50px';
      sidebar.style.height = 'calc(100vh - 50px)';
      sidebar.style.overflowY = 'auto';
      sidebar.style.overflowX = 'hidden';
      sidebar.style.flexShrink = '0';

      console.log('Redoc sidebar fixed:', sidebar.offsetWidth + 'px wide');
    }
    setTimeout(fixRedocSidebar, 1500);

    // Compact header on scroll
    var header = document.querySelector('header');
    if (header) {
      window.addEventListener('scroll', function() {
        if (window.scrollY > 50) {
          header.classList.add('compact');
        } else {
          header.classList.remove('compact');
        }
      }, { passive: true });
    }
  } else {
    setTimeout(run, 100);
  }
  };
  if (window.requestIdleCallback) {
    requestIdleCallback(run, { timeout: 2500 });
  } else {
    setTimeout(run, 1000);
  }
}
if (document.readyState === 'complete') {
  _scheduleRedocInit();
} else {
  window.addEventListener('load', _scheduleRedocInit, { once: true });
}
</script>
{% endif %}
{% endblock %}
