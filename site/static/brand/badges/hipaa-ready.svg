  </g>

  <!-- Text -->
  <text x="86" y="38" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="19" font-weight="700" fill="#2d3c34">HIPAA-Ready</text>
  <text x="86" y="60" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="14" font-weight="500" fill="#2d3c34">Architecture</text>
  <text x="86" y="76" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="10.5" font-weight="400" fill="#7e8d95" letter-spacing="0.2">De-identification &#183; Audit logging &#183; Access control</text>
</svg>
