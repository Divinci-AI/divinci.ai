<?xml version="1.0" encoding="UTF-8"?>
<!--
  HIPAA-Ready Architecture seal.

  Describes technical posture (de-identification, audit logging, access
  control) — deliberately NOT a compliance certification claim. The wording
  must stay "HIPAA-READY / ARCHITECTURE"; do not change it to "certified"
  or "compliant". Substantiating copy lives at /security/.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img"
     aria-labelledby="hipaaSealTitle hipaaSealDesc">
  <title id="hipaaSealTitle">HIPAA-Ready Architecture</title>
  <desc id="hipaaSealDesc">De-identification, audit logging, and access-control safeguards built in. Not a compliance certification.</desc>

  <defs>
    <!-- Baseline for the upper arc: glyphs grow outward from r=63. -->
    <path id="hipaaArcTop" d="M 37 100 A 63 63 0 0 1 163 100" fill="none"/>
    <!-- Baseline for the lower arc: sweep 0 runs under the bottom so the
         glyphs sit upright (growing inward from r=71), not inverted. -->
    <path id="hipaaArcBottom" d="M 29 100 A 71 71 0 0 0 171 100" fill="none"/>
  </defs>

  <!-- Seal face -->
  <circle cx="100" cy="100" r="98" fill="#f8f4f0"/>
  <!-- Outer + inner rules give the double-ring "official seal" read -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#14305c" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#14305c" stroke-width="1.5"/>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#14305c">
    <text font-size="19" font-weight="700" letter-spacing="2">
      <textPath href="#hipaaArcTop" startOffset="50%" text-anchor="middle">HIPAA-READY</textPath>
    </text>
    <text font-size="12.5" font-weight="600" letter-spacing="3.5">
      <textPath href="#hipaaArcBottom" startOffset="50%" text-anchor="middle">ARCHITECTURE</textPath>
    </text>
  </g>

  <!-- Diamond separators at the 9 and 3 o'clock seams between the two arcs -->
  <rect x="21.5" y="96.5" width="7" height="7" transform="rotate(45 25 100)" fill="#14305c"/>
  <rect x="171.5" y="96.5" width="7" height="7" transform="rotate(45 175 100)" fill="#14305c"/>

  <!-- Shield + check -->
  <path d="M 100 74 L 126 83 L 126 106 C 126 122 114 131.5 100 137
           C 86 131.5 74 122 74 106 L 74 83 Z" fill="#14305c"/>
  <path d="M 88 104 L 96.5 112.5 L 112 95" fill="none" stroke="#f8f4f0"
        stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
