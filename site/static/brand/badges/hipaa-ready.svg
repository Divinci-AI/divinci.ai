<!--
  HIPAA-Ready Architecture badge — describes technical posture
  (de-identification, audit logging, access control), NOT a compliance
  certification. Pair with substantiating copy wherever this is displayed;
  see site/content/security.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88" role="img"
     aria-labelledby="hipaaReadyTitle hipaaReadyDesc">
  <title id="hipaaReadyTitle">HIPAA-Ready Architecture</title>
  <desc id="hipaaReadyDesc">De-identification, audit logging, and access-control safeguards built in.</desc>

  <!-- Pill background -->
  <rect x="1" y="1" width="318" height="86" rx="43" fill="#ffffff" stroke="#d4c4a0" stroke-width="2"/>

  <!-- Shield-check icon -->
  <g transform="translate(20, 18)">
    <path d="M26 0 L48 8 V26 C48 41 38 50 26 56 C14 50 4 41 4 26 V8 Z"
