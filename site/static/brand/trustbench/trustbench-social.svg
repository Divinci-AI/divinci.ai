<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'DM Sans', -apple-system, sans-serif" role="img" aria-label="Divinci TrustBench. The Divinci robot, its heart bearing a verification check, on a parchment field with faint setting-out geometry. Caption: every score links to a signed manifest you can verify yourself.">
  <title>Divinci TrustBench</title>
  <rect width="1200" height="630" fill="#faf6ef"/>

  <!-- Setting-out left visible, as on the retrieval chart: a drawing that shows
       its own construction rather than presenting a finished surface. -->
  <g fill="none" stroke="#c4b394" opacity="0.3">
    <circle cx="905" cy="315" r="196" stroke-width="1.1"/>
    <circle cx="905" cy="315" r="140" stroke-width="0.8"/>
    <circle cx="905" cy="315" r="84" stroke-width="0.6"/>
    <line x1="905" y1="99" x2="905" y2="531" stroke-width="0.7"/>
    <line x1="689" y1="315" x2="1121" y2="315" stroke-width="0.7"/>
    <path d="M64 64 L100 64 M64 64 L64 100" stroke-width="1.4"/>
    <path d="M1136 566 L1100 566 M1136 566 L1136 530" stroke-width="1.4"/>
  </g>
  <g stroke="#c4b394" opacity="0.18" stroke-width="0.8">
    <line x1="128" y1="64" x2="128" y2="566"/><line x1="212" y1="64" x2="212" y2="566"/><line x1="296" y1="64" x2="296" y2="566"/><line x1="380" y1="64" x2="380" y2="566"/><line x1="464" y1="64" x2="464" y2="566"/><line x1="548" y1="64" x2="548" y2="566"/><line x1="632" y1="64" x2="632" y2="566"/><line x1="716" y1="64" x2="716" y2="566"/><line x1="800" y1="64" x2="800" y2="566"/><line x1="884" y1="64" x2="884" y2="566"/><line x1="968" y1="64" x2="968" y2="566"/><line x1="1052" y1="64" x2="1052" y2="566"/>
  </g>

  <g transform="translate(760,140) scale(1.65)" fill="#2d5a4f">
<g>
    <path d="M70,40 h60 v30 q0,10 -10,10 h-40 q-10,0 -10,-10 z"/>
    <g>
      <circle cx="85" cy="25" r="7"/><rect x="83" y="25" width="4" height="15"/>
      <circle cx="115" cy="25" r="7"/><rect x="113" y="25" width="4" height="15"/>
    </g>
    <circle cx="85" cy="60" r="6" fill="var(--tb-mark-eye, #0a192f)"/>
    <circle cx="115" cy="60" r="6" fill="var(--tb-mark-eye, #0a192f)"/>
  </g>
  <g>
    <rect x="55" y="100" width="10" height="30"/><circle cx="60" cy="140" r="5"/>
    <path d="M55,130 h10 v15 q0,5 -5,5 q-5,0 -5,-5 z"/>
    <rect x="135" y="100" width="10" height="30"/><circle cx="140" cy="140" r="5"/>
    <path d="M135,130 h10 v15 q0,5 -5,5 q-5,0 -5,-5 z"/>
  </g>
  <path fill-rule="evenodd" d="M100,115 c-12,-12 -25,-8 -25,7 c0,12 12,20 25,30 c13,-10 25,-18 25,-30 c0,-15 -13,-19 -25,-7 z M90,127 l7,7 l13,-14 l5,5 l-18,19 l-12,-12 z"/>
  </g>

  <text x="84" y="262" font-size="27" font-weight="700" fill="#8a5a20" letter-spacing="0.16em">DIVINCI TRUSTBENCH</text>
  <text x="84" y="346" font-size="62" font-weight="700" fill="#1e3a2b" letter-spacing="-0.02em">Attested benchmarks</text>
  <text x="84" y="414" font-size="62" font-weight="700" fill="#1e3a2b" letter-spacing="-0.02em">for models and stacks</text>
  <line x1="84" y1="452" x2="640" y2="452" stroke="#c4b394" stroke-width="1.4"/>
  <text x="84" y="492" font-size="22" fill="#4a3a2a">Every score links to an Ed25519-signed manifest.</text>
  <text x="84" y="524" font-size="22" fill="#4a3a2a">Verify it yourself — no account, no trust in us required.</text>
  <text x="84" y="566" font-size="17" font-family="ui-monospace, monospace" fill="#6b5d4f">@divinci-ai/trustbench-verifier</text>
</svg>
