<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="rcTitle rcDesc">
  <title id="rcTitle">The AI release cycle</title>
  <desc id="rcDesc">A four-stage cycle running clockwise. One, Version: the model, prompt and config are versioned together. Two, Deploy: the build is gated by automated checks before it ships. Three, Roll out: the new version reaches a slice of traffic first — canary, blue-green, A/B or shadow. Four, Watch and revert: live quality, latency and drift are monitored, and a rollback returns traffic to the last good version, which is why an inner arrow runs back from stage four to stage three. The cycle then continues to the next version.</desc>

  <defs>
    <marker id="rcTip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b8a080"/>
    </marker>
    <filter id="rcCard" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8b7659" flood-opacity="0.13"/>
    </filter>
    <style>
      .rc        { font-family: 'Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif; }
      .rc-card   { fill:#ffffff; stroke:#e6dccb; stroke-width:1; }
      .rc-t      { font-size:15px; font-weight:600; fill:#1e3a2b; }
      .rc-s      { font-size:10.5px; fill:#7d6a52; }
      .rc-b      { fill:#2d5a4f; }
      .rc-bn     { font-size:11px; font-weight:700; fill:#ffffff; text-anchor:middle; }
      .rc-ring   { stroke:#b8a080; stroke-width:2.5; fill:none; }
      .rc-chip   { fill:#f6f1e8; stroke:#ddd0ba; stroke-width:1; }
      .rc-chipt  { font-size:9.5px; fill:#6b5a45; text-anchor:middle; }
      .rc-back   { stroke:#b8a080; stroke-width:2; fill:none; stroke-dasharray:6 5; }
      .rc-backt  { font-size:11px; fill:#8b7659; }
      .rc-hub    { font-size:15px; font-weight:600; fill:#ffffff; text-anchor:middle; }
    </style>
  </defs>

  <g class="rc">

    <!-- ══ the cycle itself: four arcs on r=205, running clockwise ══ -->
    <path class="rc-ring" d="M536.6 164.2 A205 205 0 0 1 635.8 263.4" marker-end="url(#rcTip)"/>
    <path class="rc-ring" d="M635.8 436.6 A205 205 0 0 1 536.6 535.8" marker-end="url(#rcTip)"/>
    <path class="rc-ring" d="M363.4 535.8 A205 205 0 0 1 264.2 436.6" marker-end="url(#rcTip)"/>
    <path class="rc-ring" d="M264.2 263.4 A205 205 0 0 1 363.4 164.2" marker-end="url(#rcTip)"/>

    <!-- ══ hub ══ -->
    <circle cx="450" cy="350" r="76" fill="#2d5a4f"/>
    <text class="rc-hub" x="450" y="344">AI release</text>
    <text class="rc-hub" x="450" y="366">cycle</text>

    <!-- ══ 1 · Version (north) ══ -->
    <rect class="rc-card" x="345" y="26" width="210" height="132" rx="12" filter="url(#rcCard)"/>
    <circle class="rc-b" cx="373" cy="54" r="13"/>
    <text class="rc-bn" x="373" y="58">1</text>
    <text class="rc-t" x="396" y="59">Version</text>
    <text class="rc-s" x="363" y="82">Model, prompt and config</text>
    <rect class="rc-chip" x="363" y="94" width="83" height="18" rx="9"/>
    <text class="rc-chipt" x="404.5" y="106">model</text>
    <rect class="rc-chip" x="454" y="94" width="83" height="18" rx="9"/>
    <text class="rc-chipt" x="495.5" y="106">prompt</text>
    <rect class="rc-chip" x="363" y="118" width="83" height="18" rx="9"/>
    <text class="rc-chipt" x="404.5" y="130">config</text>
    <rect class="rc-chip" x="454" y="118" width="83" height="18" rx="9"/>
    <text class="rc-chipt" x="495.5" y="130">corpus</text>

    <!-- ══ 2 · Deploy (east) ══ -->
    <rect class="rc-card" x="630" y="284" width="210" height="132" rx="12" filter="url(#rcCard)"/>
    <circle class="rc-b" cx="658" cy="312" r="13"/>
    <text class="rc-bn" x="658" y="316">2</text>
    <text class="rc-t" x="681" y="317">Deploy</text>
    <text class="rc-s" x="648" y="340">Automated, with checks</text>
    <rect class="rc-chip" x="648" y="352" width="83" height="18" rx="9"/>
    <text class="rc-chipt" x="689.5" y="364">build</text>
    <rect class="rc-chip" x="739" y="352" width="83" height="18" rx="9"/>
    <text class="rc-chipt" x="780.5" y="364">gate on QA</text>
    <rect class="rc-chip" x="648" y="376" width="83" height="18" rx="9"/>
    <text class="rc-chipt" x="689.5" y="388">sign-off</text>
    <rect class="rc-chip" x="739" y="376" width="83" height="18" rx="9"/>
    <text class="rc-chipt" x="780.5" y="388">audit trail</text>

    <!-- ══ 3 · Roll out (south) ══ -->
    <rect class="rc-card" x="345" y="542" width="210" height="132" rx="12" filter="url(#rcCard)"/>
    <circle class="rc-b" cx="373" cy="570" r="13"/>
    <text class="rc-bn" x="373" y="574">3</text>
    <text class="rc-t" x="396" y="575">Roll out</text>
    <text class="rc-s" x="363" y="598">To a slice first, not everyone</text>
    <rect class="rc-chip" x="363" y="610" width="83" height="18" rx="9"/>
    <text class="rc-chipt" x="404.5" y="622">canary</text>
    <rect class="rc-chip" x="454" y="610" width="83" height="18" rx="9"/>
    <text class="rc-chipt" x="495.5" y="622">blue-green</text>
    <rect class="rc-chip" x="363" y="634" width="83" height="18" rx="9"/>
    <text class="rc-chipt" x="404.5" y="646">A/B test</text>
    <rect class="rc-chip" x="454" y="634" width="83" height="18" rx="9"/>
    <text class="rc-chipt" x="495.5" y="646">shadow</text>

    <!-- ══ 4 · Watch &amp; revert (west) ══ -->
    <rect class="rc-card" x="60" y="284" width="210" height="132" rx="12" filter="url(#rcCard)"/>
    <circle class="rc-b" cx="88" cy="312" r="13"/>
    <text class="rc-bn" x="88" y="316">4</text>
    <text class="rc-t" x="111" y="317">Watch</text>
    <text class="rc-s" x="78" y="340">Live signals, instant revert</text>
    <rect class="rc-chip" x="78" y="352" width="83" height="18" rx="9"/>
    <text class="rc-chipt" x="119.5" y="364">quality</text>
    <rect class="rc-chip" x="169" y="352" width="83" height="18" rx="9"/>
    <text class="rc-chipt" x="210.5" y="364">latency</text>
    <rect class="rc-chip" x="78" y="376" width="83" height="18" rx="9"/>
    <text class="rc-chipt" x="119.5" y="388">drift</text>
    <rect class="rc-chip" x="169" y="376" width="83" height="18" rx="9"/>
    <text class="rc-chipt" x="210.5" y="388">user feedback</text>

    <!-- ══ the escape hatch: revert traffic to the last good version ══ -->
    <path class="rc-back" d="M312.1 374.3 A140 140 0 0 0 425.7 487.9" marker-end="url(#rcTip)"/>
    <path d="M306 462 L322 416" stroke="#d9cdb8" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
    <text class="rc-backt" x="300" y="470" text-anchor="end">revert to the last good version</text>

  </g>
</svg>
