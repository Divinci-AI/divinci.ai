<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="qpTitle qpDesc">
  <title id="qpTitle">The LLM quality assurance pipeline</title>
  <desc id="qpDesc">Four stages run left to right. Test generation writes cases from your own data — user scenarios, edge cases, regression tests and red teaming. Validation checks every answer for factual accuracy, hallucination, bias and toxicity. Analytics scores what matters: relevance, consistency, completeness and compliance. Monitoring watches performance, anomalies, user feedback and drift after release. A feedback arrow returns from monitoring to test generation, because what monitoring finds in production becomes tomorrow's test cases.</desc>

  <defs>
    <marker id="qpTip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b8a080"/>
    </marker>
    <filter id="qpCard" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8b7659" flood-opacity="0.13"/>
    </filter>
    <style>
      .qp       { font-family: 'Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif; }
      .qp-card  { fill:#ffffff; stroke:#e6dccb; stroke-width:1; }
      .qp-t     { font-size:14px; font-weight:600; fill:#1e3a2b; }
      .qp-s     { font-size:10.5px; fill:#7d6a52; }
      .qp-b     { fill:#2d5a4f; }
      .qp-bn    { font-size:11px; font-weight:700; fill:#ffffff; text-anchor:middle; }
      .qp-rule  { stroke:#f0e8d9; stroke-width:1; }
      .qp-flow  { stroke:#b8a080; stroke-width:2; fill:none; }
      .qp-item  { fill:#fdfbf7; stroke:#e8dfd0; stroke-width:1; }
      .qp-itemt { font-size:10.5px; fill:#3d4f45; }
      .qp-loop  { stroke:#b8a080; stroke-width:1.75; fill:none; stroke-dasharray:7 5; }
      .qp-loopt { font-size:11px; fill:#8b7659; text-anchor:middle; }
    </style>
  </defs>

  <g class="qp">

    <line class="qp-flow" x1="218" y1="126" x2="238" y2="126" marker-end="url(#qpTip)"/>
    <line class="qp-flow" x1="440" y1="126" x2="460" y2="126" marker-end="url(#qpTip)"/>
    <line class="qp-flow" x1="662" y1="126" x2="682" y2="126" marker-end="url(#qpTip)"/>

    <!-- ═══ 1 · Test generation ═══ -->
    <rect class="qp-card" x="24" y="26" width="186" height="200" rx="11" filter="url(#qpCard)"/>
    <circle class="qp-b" cx="182" cy="52" r="11"/>
    <text class="qp-bn" x="182" y="56">1</text>
    <text class="qp-t" x="40" y="57">Test generation</text>
    <text class="qp-s" x="40" y="77">Cases written from your data</text>
    <line class="qp-rule" x1="40" y1="90" x2="194" y2="90"/>
    <rect class="qp-item" x="38" y="100" width="158" height="22" rx="5"/>
    <circle cx="50" cy="111" r="3" fill="#b8a080"/><text class="qp-itemt" x="60" y="115">user scenarios</text>
    <rect class="qp-item" x="38" y="128" width="158" height="22" rx="5"/>
    <circle cx="50" cy="139" r="3" fill="#b8a080"/><text class="qp-itemt" x="60" y="143">edge cases</text>
    <rect class="qp-item" x="38" y="156" width="158" height="22" rx="5"/>
    <circle cx="50" cy="167" r="3" fill="#b8a080"/><text class="qp-itemt" x="60" y="171">regression tests</text>
    <rect class="qp-item" x="38" y="184" width="158" height="22" rx="5"/>
    <circle cx="50" cy="195" r="3" fill="#b8a080"/><text class="qp-itemt" x="60" y="199">red teaming</text>

    <!-- ═══ 2 · Validation ═══ -->
    <rect class="qp-card" x="246" y="26" width="186" height="200" rx="11" filter="url(#qpCard)"/>
    <circle class="qp-b" cx="404" cy="52" r="11"/>
    <text class="qp-bn" x="404" y="56">2</text>
    <text class="qp-t" x="262" y="57">Validation</text>
    <text class="qp-s" x="262" y="77">Every answer checked</text>
    <line class="qp-rule" x1="262" y1="90" x2="416" y2="90"/>
    <rect class="qp-item" x="260" y="100" width="158" height="22" rx="5"/>
    <circle cx="272" cy="111" r="3" fill="#b8a080"/><text class="qp-itemt" x="282" y="115">fact checking</text>
    <rect class="qp-item" x="260" y="128" width="158" height="22" rx="5"/>
    <circle cx="272" cy="139" r="3" fill="#b8a080"/><text class="qp-itemt" x="282" y="143">hallucination</text>
    <rect class="qp-item" x="260" y="156" width="158" height="22" rx="5"/>
    <circle cx="272" cy="167" r="3" fill="#b8a080"/><text class="qp-itemt" x="282" y="171">bias detection</text>
    <rect class="qp-item" x="260" y="184" width="158" height="22" rx="5"/>
    <circle cx="272" cy="195" r="3" fill="#b8a080"/><text class="qp-itemt" x="282" y="199">toxicity filter</text>

    <!-- ═══ 3 · Analytics ═══ -->
    <rect class="qp-card" x="468" y="26" width="186" height="200" rx="11" filter="url(#qpCard)"/>
    <circle class="qp-b" cx="626" cy="52" r="11"/>
    <text class="qp-bn" x="626" y="56">3</text>
    <text class="qp-t" x="484" y="57">Analytics</text>
    <text class="qp-s" x="484" y="77">Scored on what matters</text>
    <line class="qp-rule" x1="484" y1="90" x2="638" y2="90"/>
    <rect class="qp-item" x="482" y="100" width="158" height="22" rx="5"/>
    <circle cx="494" cy="111" r="3" fill="#b8a080"/><text class="qp-itemt" x="504" y="115">relevance</text>
    <rect class="qp-item" x="482" y="128" width="158" height="22" rx="5"/>
    <circle cx="494" cy="139" r="3" fill="#b8a080"/><text class="qp-itemt" x="504" y="143">consistency</text>
    <rect class="qp-item" x="482" y="156" width="158" height="22" rx="5"/>
    <circle cx="494" cy="167" r="3" fill="#b8a080"/><text class="qp-itemt" x="504" y="171">completeness</text>
    <rect class="qp-item" x="482" y="184" width="158" height="22" rx="5"/>
    <circle cx="494" cy="195" r="3" fill="#b8a080"/><text class="qp-itemt" x="504" y="199">compliance</text>

    <!-- ═══ 4 · Monitoring ═══ -->
    <rect class="qp-card" x="690" y="26" width="186" height="200" rx="11" filter="url(#qpCard)"/>
    <circle class="qp-b" cx="848" cy="52" r="11"/>
    <text class="qp-bn" x="848" y="56">4</text>
    <text class="qp-t" x="706" y="57">Monitoring</text>
    <text class="qp-s" x="706" y="77">Live, after it ships</text>
    <line class="qp-rule" x1="706" y1="90" x2="860" y2="90"/>
    <rect class="qp-item" x="704" y="100" width="158" height="22" rx="5"/>
    <circle cx="716" cy="111" r="3" fill="#b8a080"/><text class="qp-itemt" x="726" y="115">performance</text>
    <rect class="qp-item" x="704" y="128" width="158" height="22" rx="5"/>
    <circle cx="716" cy="139" r="3" fill="#b8a080"/><text class="qp-itemt" x="726" y="143">anomalies</text>
    <rect class="qp-item" x="704" y="156" width="158" height="22" rx="5"/>
    <circle cx="716" cy="167" r="3" fill="#b8a080"/><text class="qp-itemt" x="726" y="171">user feedback</text>
    <rect class="qp-item" x="704" y="184" width="158" height="22" rx="5"/>
    <circle cx="716" cy="195" r="3" fill="#b8a080"/><text class="qp-itemt" x="726" y="199">drift detection</text>

    <!-- ═══ the loop that makes it a pipeline and not a checklist ═══ -->
    <path class="qp-loop" d="M783 226 L783 258 Q783 274 767 274 L133 274 Q117 274 117 258 L117 240" marker-end="url(#qpTip)"/>
    <text class="qp-loopt" x="450" y="300">What monitoring finds in production</text>
    <text class="qp-loopt" x="450" y="316">becomes tomorrow's test cases.</text>

  </g>
</svg>
