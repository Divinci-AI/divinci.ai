<?xml version="1.0" encoding="UTF-8"?>
<svg lang="es" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="dcTitle dcDesc">
  <title id="dcTitle">How AutoRAG turns raw documents into a corpus and a QA set</title>
  <desc id="dcDesc">Four stages. Parse: structure — headings, tables, figures — is recovered from PDF, Office and HTML files. Chunk: the document is split on that structure rather than on a character count, with overlap so context survives the boundary. Corpus: chunks are indexed and embedded, one vector per chunk. QA set: questions are generated from the chunks and every answer keeps a link back to the chunk it came from.</desc>

  <defs>
    <marker id="dcTip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b8a080"/>
    </marker>
    <filter id="dcCard" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8b7659" flood-opacity="0.13"/>
    </filter>
    <style>
      .dc        { font-family: 'Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif; }
      .dc-card   { fill:#ffffff; stroke:#e6dccb; stroke-width:1; }
      .dc-t      { font-size:14px; font-weight:600; fill:#1e3a2b; }
      .dc-s      { font-size:10.5px; fill:#7d6a52; }
      .dc-n      { font-size:10px; fill:#a08e74; text-anchor:middle; }
      .dc-b      { fill:#2d5a4f; }
      .dc-bn     { font-size:11px; font-weight:700; fill:#ffffff; text-anchor:middle; }
      .dc-rule   { stroke:#f0e8d9; stroke-width:1; }
      .dc-flow   { stroke:#b8a080; stroke-width:2; fill:none; }
      .dc-tile   { fill:#e8ddc7; stroke:#c9b894; stroke-width:1; }
      .dc-line   { fill:#dfd6c6; }
      .dc-sub    { fill:#fdfbf7; stroke:#e8dfd0; stroke-width:1; }
    </style>
  </defs>

  <g class="dc">

    <line class="dc-flow" x1="218" y1="160" x2="238" y2="160" marker-end="url(#dcTip)"/>
    <line class="dc-flow" x1="440" y1="160" x2="460" y2="160" marker-end="url(#dcTip)"/>
    <line class="dc-flow" x1="662" y1="160" x2="682" y2="160" marker-end="url(#dcTip)"/>

    <!-- ═════════ 1 · Parse ═════════ -->
    <rect class="dc-card" x="24" y="20" width="186" height="280" rx="11" filter="url(#dcCard)"/>
    <circle class="dc-b" cx="182" cy="46" r="11"/>
    <text class="dc-bn" x="182" y="50">1</text>
    <text class="dc-t" x="40" y="51">Analizar</text>
    <text class="dc-s" x="40" y="71">Estructura extraída de</text>
    <text class="dc-s" x="40" y="85">PDF, Office, HTML</text>
    <line class="dc-rule" x1="40" y1="96" x2="194" y2="96"/>

    <rect x="64" y="112" width="106" height="146" rx="4" fill="#ffffff" stroke="#c9b894"/>
    <rect x="76" y="124" width="58" height="8" rx="2" fill="#2d5a4f"/>
    <rect class="dc-line" x="76" y="144" width="82" height="4" rx="2"/>
    <rect class="dc-line" x="76" y="154" width="82" height="4" rx="2"/>
    <rect class="dc-line" x="76" y="164" width="54" height="4" rx="2"/>
    <!-- a recognised table -->
    <rect x="76" y="180" width="82" height="26" rx="3" fill="#f6f1e8" stroke="#d9cdb8"/>
    <line x1="103" y1="180" x2="103" y2="206" stroke="#d9cdb8"/>
    <line x1="131" y1="180" x2="131" y2="206" stroke="#d9cdb8"/>
    <line x1="76" y1="189" x2="158" y2="189" stroke="#d9cdb8"/>
    <!-- a recognised figure -->
    <rect x="76" y="216" width="40" height="28" rx="3" fill="#e8ddc7" stroke="#c9b894"/>
    <path d="M82 238 L92 227 L99 234 L106 226 L110 238 Z" fill="#c9b894"/>
    <rect class="dc-line" x="124" y="223" width="34" height="4" rx="2"/>
    <rect class="dc-line" x="124" y="233" width="24" height="4" rx="2"/>

    <text class="dc-n" x="117" y="280">títulos · tablas · figuras</text>

    <!-- ═════════ 2 · Chunk ═════════ -->
    <rect class="dc-card" x="246" y="20" width="186" height="280" rx="11" filter="url(#dcCard)"/>
    <circle class="dc-b" cx="404" cy="46" r="11"/>
    <text class="dc-bn" x="404" y="50">2</text>
    <text class="dc-t" x="262" y="51">Fragmentar</text>
    <text class="dc-s" x="262" y="71">Se divide por esa estructura,</text>
    <text class="dc-s" x="262" y="85">no por número de caracteres</text>
    <line class="dc-rule" x1="262" y1="96" x2="416" y2="96"/>

    <rect class="dc-sub" x="266" y="112" width="146" height="42" rx="6"/>
    <rect x="276" y="122" width="10" height="22" rx="2" fill="#e8ddc7" stroke="#c9b894"/>
    <rect class="dc-line" x="294" y="126" width="102" height="4" rx="2"/>
    <rect class="dc-line" x="294" y="136" width="76" height="4" rx="2"/>

    <rect x="322" y="148" width="34" height="10" rx="5" fill="#e8ddc7" stroke="#c9b894"/>

    <rect class="dc-sub" x="266" y="162" width="146" height="42" rx="6"/>
    <rect x="276" y="172" width="10" height="22" rx="2" fill="#e8ddc7" stroke="#c9b894"/>
    <rect class="dc-line" x="294" y="176" width="102" height="4" rx="2"/>
    <rect class="dc-line" x="294" y="186" width="88" height="4" rx="2"/>

    <rect x="322" y="198" width="34" height="10" rx="5" fill="#e8ddc7" stroke="#c9b894"/>

    <rect class="dc-sub" x="266" y="212" width="146" height="42" rx="6"/>
    <rect x="276" y="222" width="10" height="22" rx="2" fill="#e8ddc7" stroke="#c9b894"/>
    <rect class="dc-line" x="294" y="226" width="102" height="4" rx="2"/>
    <rect class="dc-line" x="294" y="236" width="62" height="4" rx="2"/>

    <text class="dc-n" x="339" y="280">el solape guarda contexto</text>

    <!-- ═════════ 3 · Corpus ═════════ -->
    <rect class="dc-card" x="468" y="20" width="186" height="280" rx="11" filter="url(#dcCard)"/>
    <circle class="dc-b" cx="626" cy="46" r="11"/>
    <text class="dc-bn" x="626" y="50">3</text>
    <text class="dc-t" x="484" y="51">Corpus</text>
    <text class="dc-s" x="484" y="71">Fragmentos indexados y</text>
    <text class="dc-s" x="484" y="85">vectorizados para buscar</text>
    <line class="dc-rule" x1="484" y1="96" x2="638" y2="96"/>

    <g>
      <rect class="dc-tile" x="496" y="112" width="28" height="18" rx="4"/>
      <rect class="dc-tile" x="530" y="112" width="28" height="18" rx="4"/>
      <rect x="564" y="112" width="28" height="18" rx="4" fill="#d8c8a8" stroke="#c9b894"/>
      <rect class="dc-tile" x="598" y="112" width="28" height="18" rx="4"/>
      <rect class="dc-tile" x="496" y="136" width="28" height="18" rx="4"/>
      <rect x="530" y="136" width="28" height="18" rx="4" fill="#d8c8a8" stroke="#c9b894"/>
      <rect class="dc-tile" x="564" y="136" width="28" height="18" rx="4"/>
      <rect class="dc-tile" x="598" y="136" width="28" height="18" rx="4"/>
      <rect class="dc-tile" x="496" y="160" width="28" height="18" rx="4"/>
      <rect class="dc-tile" x="530" y="160" width="28" height="18" rx="4"/>
      <rect class="dc-tile" x="564" y="160" width="28" height="18" rx="4"/>
      <rect x="598" y="160" width="28" height="18" rx="4" fill="#d8c8a8" stroke="#c9b894"/>
    </g>

    <path class="dc-flow" d="M552 194 L561 203 L570 194" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- embedding "barcode": one vector per chunk -->
    <rect x="496" y="214" width="130" height="32" rx="6" fill="#f6f1e8" stroke="#ddd0ba"/>
    <g fill="#2d5a4f">
      <rect x="505" y="226" width="4" height="10" rx="2" opacity="0.85"/>
      <rect x="514" y="222" width="4" height="18" rx="2" opacity="0.55"/>
      <rect x="523" y="228" width="4" height="6"  rx="2" opacity="0.75"/>
      <rect x="532" y="220" width="4" height="22" rx="2" opacity="0.45"/>
      <rect x="541" y="225" width="4" height="12" rx="2" opacity="0.8"/>
      <rect x="550" y="223" width="4" height="16" rx="2" opacity="0.6"/>
      <rect x="559" y="228" width="4" height="6"  rx="2" opacity="0.85"/>
      <rect x="568" y="221" width="4" height="20" rx="2" opacity="0.5"/>
      <rect x="577" y="226" width="4" height="10" rx="2" opacity="0.7"/>
      <rect x="586" y="223" width="4" height="16" rx="2" opacity="0.55"/>
      <rect x="595" y="227" width="4" height="8"  rx="2" opacity="0.8"/>
      <rect x="604" y="222" width="4" height="18" rx="2" opacity="0.5"/>
      <rect x="613" y="226" width="4" height="10" rx="2" opacity="0.75"/>
    </g>

    <text class="dc-n" x="561" y="280">un vector por fragmento</text>

    <!-- ═════════ 4 · QA set ═════════ -->
    <rect class="dc-card" x="690" y="20" width="186" height="280" rx="11" filter="url(#dcCard)"/>
    <circle class="dc-b" cx="848" cy="46" r="11"/>
    <text class="dc-bn" x="848" y="50">4</text>
    <text class="dc-t" x="706" y="51">Conjunto QA</text>
    <text class="dc-s" x="706" y="71">Preguntas generadas,</text>
    <text class="dc-s" x="706" y="85">respuestas rastreables</text>
    <line class="dc-rule" x1="706" y1="96" x2="860" y2="96"/>

    <g>
      <rect class="dc-sub" x="706" y="112" width="154" height="56" rx="6"/>
      <circle cx="722" cy="128" r="8" fill="#2d5a4f"/>
      <text x="722" y="131.5" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">Q</text>
      <rect class="dc-line" x="738" y="122" width="86" height="4" rx="2"/>
      <rect class="dc-line" x="738" y="132" width="62" height="4" rx="2"/>
      <circle cx="722" cy="152" r="8" fill="#b8a080"/>
      <text x="722" y="155.5" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
      <rect class="dc-line" x="738" y="150" width="74" height="4" rx="2"/>
      <path d="M826 128 L838 128" stroke="#c9b894" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect class="dc-tile" x="838" y="122" width="12" height="12" rx="3"/>
    </g>
    <g>
      <rect class="dc-sub" x="706" y="178" width="154" height="56" rx="6"/>
      <circle cx="722" cy="194" r="8" fill="#2d5a4f"/>
      <text x="722" y="197.5" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">Q</text>
      <rect class="dc-line" x="738" y="188" width="78" height="4" rx="2"/>
      <rect class="dc-line" x="738" y="198" width="54" height="4" rx="2"/>
      <circle cx="722" cy="218" r="8" fill="#b8a080"/>
      <text x="722" y="221.5" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
      <rect class="dc-line" x="738" y="216" width="66" height="4" rx="2"/>
      <path d="M826 194 L838 194" stroke="#c9b894" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect class="dc-tile" x="838" y="188" width="12" height="12" rx="3"/>
    </g>

    <text class="dc-n" x="783" y="262">cada respuesta enlaza</text>
    <text class="dc-n" x="783" y="278">con su fragmento de origen</text>

  </g>
</svg>
