<?xml version="1.0" encoding="UTF-8"?>
<svg lang="es" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" role="img" aria-labelledby="arTitle arDesc">
  <title id="arTitle">How AutoRAG finds your best RAG pipeline</title>
  <desc id="arDesc">A four-stage loop. One: your connected sources are parsed and chunked into a corpus. Two: AutoRAG generates a QA set of questions written from your own chunks, each traceable to the chunk that answers it. Three: candidate pipeline configurations — chunk size, embedding model, top-k, reranking — are swept and run against that QA set. Four: candidates are scored on recall, nDCG and faithfulness, and the best-scoring configuration is deployed as your live pipeline. Arena and production feedback then returns hard cases to the QA set, and the search runs again.</desc>

  <defs>
    <marker id="arTip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b8a080"/>
    </marker>
    <filter id="arCard" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8b7659" flood-opacity="0.13"/>
    </filter>
    <style>
      .ar         { font-family: 'Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif; }
      .ar-card    { fill:#ffffff; stroke:#e6dccb; stroke-width:1; }
      .ar-title   { font-size:14.5px; font-weight:600; fill:#1e3a2b; }
      .ar-sub     { font-size:11.5px; fill:#7d6a52; }
      .ar-note    { font-size:10.5px; fill:#a08e74; text-anchor:middle; }
      .ar-cap     { font-size:11px; fill:#8b7659; text-anchor:middle; }
      .ar-badge   { fill:#2d5a4f; }
      .ar-badge-n { font-size:12px; font-weight:700; fill:#ffffff; text-anchor:middle; }
      .ar-rule    { stroke:#f0e8d9; stroke-width:1; }
      .ar-flow    { stroke:#b8a080; stroke-width:2; fill:none; }
      .ar-chip    { fill:#f6f1e8; stroke:#ddd0ba; stroke-width:1; }
      .ar-chip-on { fill:#2d5a4f; }
      .ar-chip-t  { font-size:10px; fill:#6b5a45; text-anchor:middle; }
      .ar-chip-to { font-size:10px; font-weight:600; fill:#ffffff; text-anchor:middle; }
      .ar-axis    { font-size:10.5px; fill:#8b7659; }
      .ar-row     { fill:#fdfbf7; stroke:#e8dfd0; stroke-width:1; }
      .ar-qa      { font-size:9.5px; font-weight:700; }
      .ar-loop    { stroke:#b8a080; stroke-width:1.75; fill:none; stroke-dasharray:7 5; }
      .ar-loop-t  { font-size:11.5px; fill:#8b7659; text-anchor:middle; }
    </style>
  </defs>

  <g class="ar">

    <!-- ═══ flow arrows between the four stages ═══ -->
    <line class="ar-flow" x1="229" y1="167" x2="257" y2="167" marker-end="url(#arTip)"/>
    <line class="ar-flow" x1="466" y1="167" x2="494" y2="167" marker-end="url(#arTip)"/>
    <line class="ar-flow" x1="703" y1="167" x2="731" y2="167" marker-end="url(#arTip)"/>

    <!-- ══════════════ 1 · Your corpus ══════════════ -->
    <rect class="ar-card" x="28" y="32" width="193" height="270" rx="12" filter="url(#arCard)"/>
    <circle class="ar-badge" cx="193" cy="58" r="12"/>
    <text class="ar-badge-n" x="193" y="62">1</text>
    <text class="ar-title" x="46" y="63">Tu corpus</text>
    <text class="ar-sub" x="46" y="84">Analizado y fragmentado</text>
    <text class="ar-sub" x="46" y="99">desde tus fuentes</text>
    <line class="ar-rule" x1="46" y1="112" x2="203" y2="112"/>

    <!-- stacked source documents -->
    <rect x="98" y="130" width="40" height="48" rx="4" fill="#f6f1e8" stroke="#ddd0ba"/>
    <rect x="104" y="136" width="40" height="48" rx="4" fill="#faf6ef" stroke="#ddd0ba"/>
    <rect x="110" y="142" width="40" height="48" rx="4" fill="#ffffff" stroke="#c9b894"/>
    <rect x="118" y="154" width="24" height="3" rx="1.5" fill="#d9cdb8"/>
    <rect x="118" y="162" width="24" height="3" rx="1.5" fill="#d9cdb8"/>
    <rect x="118" y="170" width="15" height="3" rx="1.5" fill="#d9cdb8"/>

    <path class="ar-flow" d="M116 198 L124.5 207 L133 198" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- chunks -->
    <rect x="47"  y="218" width="26" height="20" rx="4" fill="#e8ddc7" stroke="#c9b894"/>
    <rect x="79"  y="218" width="26" height="20" rx="4" fill="#e8ddc7" stroke="#c9b894"/>
    <rect x="111" y="218" width="26" height="20" rx="4" fill="#e8ddc7" stroke="#c9b894"/>
    <rect x="143" y="218" width="26" height="20" rx="4" fill="#e8ddc7" stroke="#c9b894"/>
    <rect x="175" y="218" width="26" height="20" rx="4" fill="#e8ddc7" stroke="#c9b894"/>

    <text class="ar-cap"  x="124.5" y="258">fragmentos</text>
    <text class="ar-note" x="124.5" y="278">PDF · Office · Wiki · Código · BD</text>

    <!-- ══════════════ 2 · Generated QA set ══════════════ -->
    <rect class="ar-card" x="265" y="32" width="193" height="270" rx="12" filter="url(#arCard)"/>
    <circle class="ar-badge" cx="430" cy="58" r="12"/>
    <text class="ar-badge-n" x="430" y="62">2</text>
    <text class="ar-title" x="283" y="63">Conjunto QA</text>
    <text class="ar-sub" x="283" y="84">Preguntas escritas desde</text>
    <text class="ar-sub" x="283" y="99">tus propios fragmentos</text>
    <line class="ar-rule" x1="283" y1="112" x2="440" y2="112"/>

    <g>
      <rect class="ar-row" x="283" y="128" width="157" height="40" rx="6"/>
      <rect x="291" y="141" width="14" height="14" rx="3" fill="#e8ddc7" stroke="#c9b894"/>
      <text class="ar-qa" x="313" y="144" fill="#2d5a4f">Q</text>
      <rect x="325" y="138" width="92" height="4" rx="2" fill="#cfd8d1"/>
      <text class="ar-qa" x="313" y="160" fill="#b8a080">A</text>
      <rect x="325" y="154" width="68" height="4" rx="2" fill="#e2d8c6"/>
    </g>
    <g>
      <rect class="ar-row" x="283" y="172" width="157" height="40" rx="6"/>
      <rect x="291" y="185" width="14" height="14" rx="3" fill="#e8ddc7" stroke="#c9b894"/>
      <text class="ar-qa" x="313" y="188" fill="#2d5a4f">Q</text>
      <rect x="325" y="182" width="80" height="4" rx="2" fill="#cfd8d1"/>
      <text class="ar-qa" x="313" y="204" fill="#b8a080">A</text>
      <rect x="325" y="198" width="57" height="4" rx="2" fill="#e2d8c6"/>
    </g>
    <g>
      <rect class="ar-row" x="283" y="216" width="157" height="40" rx="6"/>
      <rect x="291" y="229" width="14" height="14" rx="3" fill="#e8ddc7" stroke="#c9b894"/>
      <text class="ar-qa" x="313" y="232" fill="#2d5a4f">Q</text>
      <rect x="325" y="226" width="88" height="4" rx="2" fill="#cfd8d1"/>
      <text class="ar-qa" x="313" y="248" fill="#b8a080">A</text>
      <rect x="325" y="242" width="63" height="4" rx="2" fill="#e2d8c6"/>
    </g>

    <text class="ar-note" x="361.5" y="274">Cada pregunta apunta</text>
    <text class="ar-note" x="361.5" y="288">al fragmento que la responde</text>

    <!-- ══════════════ 3 · Pipeline search ══════════════ -->
    <rect class="ar-card" x="502" y="32" width="193" height="270" rx="12" filter="url(#arCard)"/>
    <circle class="ar-badge" cx="667" cy="58" r="12"/>
    <text class="ar-badge-n" x="667" y="62">3</text>
    <text class="ar-title" x="520" y="63">Búsqueda</text>
    <text class="ar-sub" x="520" y="84">Cada configuración candidata,</text>
    <text class="ar-sub" x="520" y="99">probada con ese conjunto</text>
    <line class="ar-rule" x1="520" y1="112" x2="677" y2="112"/>

    <!-- chunk size -->
    <text class="ar-axis" x="520" y="144">chunk</text>
    <rect class="ar-chip"    x="570" y="130" width="31" height="20" rx="5"/>
    <text class="ar-chip-t"  x="585.5" y="144">256</text>
    <rect class="ar-chip-on" x="607" y="130" width="31" height="20" rx="5"/>
    <text class="ar-chip-to" x="622.5" y="144">512</text>
    <rect class="ar-chip"    x="644" y="130" width="31" height="20" rx="5"/>
    <text class="ar-chip-t"  x="659.5" y="144">1k</text>

    <!-- embedding model -->
    <text class="ar-axis" x="520" y="180">embed</text>
    <rect class="ar-chip"    x="570" y="166" width="31" height="20" rx="5"/>
    <text class="ar-chip-t"  x="585.5" y="180">e5</text>
    <rect class="ar-chip"    x="607" y="166" width="31" height="20" rx="5"/>
    <text class="ar-chip-t"  x="622.5" y="180">bge</text>
    <rect class="ar-chip-on" x="644" y="166" width="31" height="20" rx="5"/>
    <text class="ar-chip-to" x="659.5" y="180">oai</text>

    <!-- top-k -->
    <text class="ar-axis" x="520" y="216">top-k</text>
    <rect class="ar-chip-on" x="570" y="202" width="31" height="20" rx="5"/>
    <text class="ar-chip-to" x="585.5" y="216">3</text>
    <rect class="ar-chip"    x="607" y="202" width="31" height="20" rx="5"/>
    <text class="ar-chip-t"  x="622.5" y="216">5</text>
    <rect class="ar-chip"    x="644" y="202" width="31" height="20" rx="5"/>
    <text class="ar-chip-t"  x="659.5" y="216">10</text>

    <!-- rerank -->
    <text class="ar-axis" x="520" y="252">rerank</text>
    <rect class="ar-chip"    x="570" y="238" width="31" height="20" rx="5"/>
    <text class="ar-chip-t"  x="585.5" y="252">off</text>
    <rect class="ar-chip-on" x="607" y="238" width="31" height="20" rx="5"/>
    <text class="ar-chip-to" x="622.5" y="252">on</text>

    <text class="ar-note" x="598.5" y="276">una combinación de muchas:</text>
    <text class="ar-note" x="598.5" y="290">se recorre toda la malla</text>

    <!-- ══════════════ 4 · Scored winner ══════════════ -->
    <rect class="ar-card" x="739" y="32" width="193" height="270" rx="12" filter="url(#arCard)"/>
    <circle class="ar-badge" cx="904" cy="58" r="12"/>
    <text class="ar-badge-n" x="904" y="62">4</text>
    <text class="ar-title" x="757" y="63">Ganadora</text>
    <text class="ar-sub" x="757" y="84">La mejor configuración</text>
    <text class="ar-sub" x="757" y="99">pasa a ser tu pipeline</text>
    <line class="ar-rule" x1="757" y1="112" x2="914" y2="112"/>

    <text class="ar-note" x="835.5" y="134">recall · nDCG · fidelidad</text>

    <!-- winning candidate -->
    <rect x="757" y="144" width="157" height="26" rx="6" fill="#2d5a4f"/>
    <text x="770" y="161" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <rect x="786" y="153" width="84" height="6" rx="3" fill="#ffffff" opacity="0.28"/>
    <rect x="786" y="153" width="84" height="6" rx="3" fill="#d8c8a8"/>
    <path d="M884 157 l4 4 l8 -9" stroke="#d8c8a8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect class="ar-row" x="757" y="174" width="157" height="26" rx="6"/>
    <text x="770" y="191" font-size="11" font-weight="700" fill="#8b7659">2</text>
    <rect x="786" y="183" width="84" height="6" rx="3" fill="#ece5d8"/>
    <rect x="786" y="183" width="62" height="6" rx="3" fill="#c4b394"/>

    <rect class="ar-row" x="757" y="204" width="157" height="26" rx="6"/>
    <text x="770" y="221" font-size="11" font-weight="700" fill="#8b7659">3</text>
    <rect x="786" y="213" width="84" height="6" rx="3" fill="#ece5d8"/>
    <rect x="786" y="213" width="48" height="6" rx="3" fill="#d5c8ae"/>

    <path class="ar-flow" d="M827 240 L835.5 249 L844 240" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="765" y="252" width="141" height="26" rx="13" fill="#e8ddc7" stroke="#c9b894"/>
    <text x="835.5" y="269" font-size="11.5" font-weight="600" fill="#1e3a2b" text-anchor="middle">Pipeline desplegado</text>

    <!-- ══════════════ feedback loop ══════════════ -->
    <path class="ar-loop"
          d="M835.5 302 L835.5 368 Q835.5 384 819.5 384 L377.5 384 Q361.5 384 361.5 368 L361.5 316"
          marker-end="url(#arTip)"/>
    <text class="ar-loop-t" x="598.5" y="408">Los casos difíciles del arena y de producción</text>
    <text class="ar-loop-t" x="598.5" y="424">vuelven al conjunto QA y la búsqueda se repite</text>

  </g>
</svg>
