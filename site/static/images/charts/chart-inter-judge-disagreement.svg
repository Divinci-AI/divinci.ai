<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="'DM Sans', -apple-system, sans-serif" role="img" aria-label="Bar chart of pairwise Spearman ρ between three Gemini judges scoring the same answers under the same rubric. gemini-2.5-flash vs gemini-3.1-pro-preview ρ=0.679 (n=28). gemini-2.5-flash vs gemini-3.1-pro on the larger 415-item pool ρ=0.552. flash-lite-preview vs gemini-2.5-flash ρ=0.750. flash-lite-preview vs gemini-3.1-pro-preview ρ=0.658. All four pairs land below the 0.85 threshold we use for human-anchored judge calibration; three of the four also land below the 0.70 moderate-consensus floor, marked with a dashed amber line.">
  <title>Inter-judge Spearman ρ — three Gemini judges, same answers, same rubric</title>
  <rect width="760" height="500" fill="#faf8f5"/>

  <!-- Title -->
  <text x="40" y="36" font-size="16" font-weight="700" fill="#1e3a2b">Inter-judge Spearman ρ — same answers, same rubric, three Gemini judges</text>
  <text x="40" y="56" font-size="12" fill="#1e3a2b" font-weight="500">No pair clears the 0.85 human-anchor threshold; three of four fall below 0.70 moderate-consensus floor</text>

  <!-- Threshold bands. The two threshold labels are only 72px apart
       horizontally (x=516 vs x=588), but each label is ~140-190px wide,
       so centering both at the same y collides them. Staggered vertically:
       0.70 sits at y=72 (just under the subtitle), 0.85 at y=92, both with
       leader-lines tying them back to their respective dashed verticals. -->
  <g>
    <!-- 0.85 threshold band -->
    <rect x="588" y="98" width="72" height="262" fill="#2d5a4f" opacity="0.06"/>
    <line x1="588" y1="98" x2="588" y2="360" stroke="#2d5a4f" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.85"/>
    <text x="588" y="92" font-size="10" fill="#1e3a2b" text-anchor="middle" font-weight="700">0.85 — human-anchor threshold</text>
    <!-- 0.70 floor -->
    <line x1="516" y1="98" x2="516" y2="360" stroke="#c08850" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.85"/>
    <text x="516" y="72" font-size="10" fill="#6b3f0f" text-anchor="middle" font-weight="700">0.70 — moderate floor</text>
  </g>

  <!-- Axis (linear, 0.0 → 1.0).  px(v) = 240 + v * 420. So 0→240, 0.5→450, 0.85→597, 1.0→660 -->
  <g stroke="#d4c8b0" stroke-width="1" font-size="10" fill="#2d3c34">
    <line x1="240" y1="360" x2="660" y2="360" stroke="#2d3c34" stroke-width="1.2"/>
    <line x1="240" y1="80" x2="240" y2="360"/>
    <line x1="345" y1="80" x2="345" y2="360" opacity="0.4"/>
    <line x1="450" y1="80" x2="450" y2="360" opacity="0.4"/>
    <line x1="555" y1="80" x2="555" y2="360" opacity="0.4"/>
    <line x1="660" y1="80" x2="660" y2="360" opacity="0.4"/>
    <text x="240" y="378" text-anchor="middle" font-weight="600">0.0</text>
    <text x="345" y="378" text-anchor="middle" font-weight="600">0.25</text>
    <text x="450" y="378" text-anchor="middle" font-weight="600">0.50</text>
    <text x="555" y="378" text-anchor="middle" font-weight="600">0.75</text>
    <text x="660" y="378" text-anchor="middle" font-weight="600">1.00</text>
    <text x="450" y="400" text-anchor="middle" font-size="11" fill="#1e3a2b" font-style="italic" font-weight="500">Spearman ρ — agreement between two judges on the same items</text>
  </g>

  <!-- Bars: 4 pairwise comparisons, bar height 28, gap 18, y-start 100 -->
  <g font-size="11">
    <!-- 1. flash-lite ↔ 2.5-flash  ρ=0.750  (closest to threshold) -->
    <text x="230" y="119" text-anchor="end" fill="#2d3c34" font-weight="600">flash-lite-preview ↔ 2.5-flash</text>
    <!-- 0.750 → 240 + 0.750*420 = 555 -->
    <rect x="240" y="106" width="315" height="28" fill="#c08850" opacity="0.85"/>
    <text x="562" y="125" fill="#8a5a20" font-weight="700">0.750</text>

    <!-- 2. 2.5-flash ↔ 3.1-pro (calibration sample n=28)  ρ=0.679 -->
    <text x="230" y="167" text-anchor="end" fill="#2d3c34" font-weight="600">2.5-flash ↔ 3.1-pro-preview</text>
    <text x="230" y="180" text-anchor="end" fill="#3a3025" font-size="9" font-weight="600">calibration sample, n=28</text>
    <!-- 0.679 → 240 + 0.679*420 = 525.2 -->
    <rect x="240" y="154" width="285" height="28" fill="#c08850" opacity="0.85"/>
    <text x="532" y="173" fill="#8a5a20" font-weight="700">0.679</text>

    <!-- 3. 2.5-flash ↔ 3.1-pro (large pool n=413)  ρ=0.552 — THE HEADLINE -->
    <text x="230" y="215" text-anchor="end" fill="#2d3c34" font-weight="700">2.5-flash ↔ 3.1-pro</text>
    <text x="230" y="228" text-anchor="end" fill="#7a2828" font-size="9" font-weight="700">larger pool, n=413 — the headline</text>
    <!-- 0.552 → 240 + 0.552*420 = 471.84 -->
    <rect x="240" y="202" width="232" height="28" fill="#a04848" opacity="0.85"/>
    <text x="479" y="221" fill="#7a2828" font-weight="700">0.552</text>

    <!-- 4. flash-lite ↔ 3.1-pro  ρ=0.658 -->
    <text x="230" y="263" text-anchor="end" fill="#2d3c34" font-weight="600">flash-lite-preview ↔ 3.1-pro</text>
    <!-- 0.658 → 240 + 0.658*420 = 516.4 -->
    <rect x="240" y="250" width="276" height="28" fill="#c08850" opacity="0.85"/>
    <text x="523" y="269" fill="#8a5a20" font-weight="700">0.658</text>
  </g>

  <!-- Verdict box — moved below the axis to avoid overlapping ticks/labels -->
  <g transform="translate(40, 416)">
    <rect x="0" y="0" width="680" height="60" rx="6" fill="#a04848" opacity="0.08"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#7a2828">Verdict: don't adopt 3.1-pro as the new judge.</text>
    <text x="14" y="40" font-size="10" fill="#4a3a2a">Re-running the arena with 3.1-pro would change the headline by an unknown amount, and we'd lose comparability with prior data.</text>
    <text x="14" y="55" font-size="10" fill="#4a3a2a" font-style="italic">Stay on flash-lite-preview as established baseline. Add the methods caveat. Build a human anchor next.</text>
  </g>

  <!-- Caption -->
  <text x="40" y="494" font-size="11" fill="#1e3a2b" font-style="italic" font-weight="500">Pre-registered pass criterion: ρ ≥ 0.85 vs human anchor. Inter-LLM ρ in the 0.66–0.75 range is moderate, not high — switching judges between arena runs is methodologically invalid.</text>
</svg>
