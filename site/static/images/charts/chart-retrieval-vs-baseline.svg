<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" font-family="'DM Sans', -apple-system, sans-serif" role="img" aria-label="Seven retrieval rows drawn as cut crystal prisms on a parchment field, across two TrustBench boards with the answering model held fixed. Dr. Fuhrman Nutrition Corpus: Vertex AI Vector Search v2 0.920, Qdrant 0.884, Vectorize 0.836, Divinci PageIndex 0.384. Divinci SDK Docs: Vertex 0.755, Qdrant 0.732. The final row, no retrieval, is drawn as an unlit fractured amber stone at 0.078. Each crystal terminates in a point whose apex marks the measured value against a dashed datum line.">
