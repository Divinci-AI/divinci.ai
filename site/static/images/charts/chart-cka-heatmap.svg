<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="'DM Sans', -apple-system, sans-serif" role="img" aria-label="4x4 CKA similarity heatmap. Diagonal cells (matched stages) are dark green showing high similarity 0.941-0.992. Off-diagonal cells are cream/light showing low similarity 0.35-0.78. The entity-entity cell at 0.992 is the darkest.">
  <title>CKA Heatmap — Depth-Stage Alignment Between Gemma4-E2B and Qwen3-8B</title>
  <rect width="760" height="460" fill="#faf8f5"/>

  <!-- Title -->
  <text x="40" y="34" font-size="16" font-weight="700" fill="#1e3a2b">CKA Heatmap — Which Depth Stages Align Across Models?</text>
  <text x="40" y="54" font-size="12" fill="#6b5d4f">Dark = high representational similarity. Diagonal = matched depth stage. Off-diagonal = mismatched.</text>

  <!-- Column headers (Gemma4 stages) -->
  <text x="40" y="90" font-size="12" fill="#1e3a2b" font-weight="600">Qwen3-8B →</text>
  <text x="199" y="94" text-anchor="middle" font-size="11" fill="#4a3a2a">Broadcast</text>
  <text x="199" y="107" text-anchor="middle" font-size="10" fill="#8a7d68">~15% depth</text>
  <text x="329" y="94" text-anchor="middle" font-size="11" fill="#4a3a2a">Domain</text>
  <text x="329" y="107" text-anchor="middle" font-size="10" fill="#8a7d68">~30% depth</text>
  <text x="459" y="94" text-anchor="middle" font-size="11" fill="#2d5a4f" font-weight="700">Entity</text>
  <text x="459" y="107" text-anchor="middle" font-size="10" fill="#2d5a4f">~55% depth</text>
  <text x="589" y="94" text-anchor="middle" font-size="11" fill="#4a3a2a">Prediction</text>
  <text x="589" y="107" text-anchor="middle" font-size="10" fill="#8a7d68">~85% depth</text>

  <!-- Row headers (Gemma4 stages) — rotated left labels -->
  <text x="130" y="155" text-anchor="end" font-size="11" fill="#4a3a2a">Broadcast</text>
  <text x="130" y="168" text-anchor="end" font-size="10" fill="#8a7d68">~15%</text>
  <text x="130" y="225" text-anchor="end" font-size="11" fill="#4a3a2a">Domain</text>
  <text x="130" y="238" text-anchor="end" font-size="10" fill="#8a7d68">~30%</text>
  <text x="130" y="295" text-anchor="end" font-size="11" fill="#2d5a4f" font-weight="700">Entity</text>
  <text x="130" y="308" text-anchor="end" font-size="10" fill="#2d5a4f">~55%</text>
  <text x="130" y="365" text-anchor="end" font-size="11" fill="#4a3a2a">Prediction</text>
  <text x="130" y="378" text-anchor="end" font-size="10" fill="#8a7d68">~85%</text>
  <text x="40" y="280" text-anchor="middle" font-size="12" fill="#1e3a2b" font-weight="600" transform="rotate(-90 40 280)">← Gemma4-E2B</text>

  <!-- Grid border -->
  <rect x="134" y="114" width="520" height="280" fill="none" stroke="#d4c8b0" stroke-width="1.5" rx="4"/>

  <!-- Helper: opacity = (v - 0.35) / 0.642, fill = #2d5a4f -->
  <!-- Row 0 (Broadcast): y=114, h=70 -->
  <!-- Row 1 (Domain): y=184, h=70 -->
  <!-- Row 2 (Entity): y=254, h=70 -->
  <!-- Row 3 (Prediction): y=324, h=70 -->
  <!-- Col 0 (Broadcast): x=134, w=130 -->
  <!-- Col 1 (Domain): x=264, w=130 -->
  <!-- Col 2 (Entity): x=394, w=130 -->
  <!-- Col 3 (Prediction): x=524, w=130 -->

  <!-- Row 0: Broadcast stage -->
  <!-- [0,0] Broadcast×Broadcast: 0.941, op=(0.941-0.35)/0.642=0.920 -->
  <rect x="134" y="114" width="130" height="70" fill="#2d5a4f" opacity="0.920" rx="2"/>
  <!-- [0,1] Broadcast×Domain: 0.62, op=(0.62-0.35)/0.642=0.421 -->
  <rect x="264" y="114" width="130" height="70" fill="#2d5a4f" opacity="0.421" rx="2"/>
  <!-- [0,2] Broadcast×Entity: 0.39, op=(0.39-0.35)/0.642=0.062 -->
  <rect x="394" y="114" width="130" height="70" fill="#2d5a4f" opacity="0.062" rx="2"/>
  <!-- [0,3] Broadcast×Prediction: 0.35, op=0 -->
  <rect x="524" y="114" width="130" height="70" fill="#2d5a4f" opacity="0.002" rx="2"/>

  <!-- Row 1: Domain stage -->
  <!-- [1,0] Domain×Broadcast: 0.58, op=0.358 -->
  <rect x="134" y="184" width="130" height="70" fill="#2d5a4f" opacity="0.358" rx="2"/>
  <!-- [1,1] Domain×Domain: 0.967, op=0.961 -->
  <rect x="264" y="184" width="130" height="70" fill="#2d5a4f" opacity="0.961" rx="2"/>
  <!-- [1,2] Domain×Entity: 0.70, op=0.545 -->
  <rect x="394" y="184" width="130" height="70" fill="#2d5a4f" opacity="0.545" rx="2"/>
  <!-- [1,3] Domain×Prediction: 0.44, op=0.140 -->
  <rect x="524" y="184" width="130" height="70" fill="#2d5a4f" opacity="0.140" rx="2"/>

  <!-- Row 2: Entity stage (HIGHLIGHT ROW) -->
  <!-- [2,0] Entity×Broadcast: 0.41, op=0.093 -->
  <rect x="134" y="254" width="130" height="70" fill="#2d5a4f" opacity="0.093" rx="2"/>
  <!-- [2,1] Entity×Domain: 0.65, op=0.467 -->
  <rect x="264" y="254" width="130" height="70" fill="#2d5a4f" opacity="0.467" rx="2"/>
  <!-- [2,2] Entity×Entity: 0.992 — THE PEAK — extra outline -->
  <rect x="394" y="254" width="130" height="70" fill="#2d5a4f" opacity="1.0" rx="2"/>
  <rect x="394" y="254" width="130" height="70" fill="none" stroke="#f3c98f" stroke-width="2.5" rx="2"/>
  <!-- [2,3] Entity×Prediction: 0.78, op=0.670 -->
  <rect x="524" y="254" width="130" height="70" fill="#2d5a4f" opacity="0.670" rx="2"/>

  <!-- Row 3: Prediction stage -->
  <!-- [3,0] Prediction×Broadcast: 0.35, op=0 -->
  <rect x="134" y="324" width="130" height="70" fill="#2d5a4f" opacity="0.002" rx="2"/>
  <!-- [3,1] Prediction×Domain: 0.42, op=0.109 -->
  <rect x="264" y="324" width="130" height="70" fill="#2d5a4f" opacity="0.109" rx="2"/>
  <!-- [3,2] Prediction×Entity: 0.71, op=0.561 -->
  <rect x="394" y="324" width="130" height="70" fill="#2d5a4f" opacity="0.561" rx="2"/>
  <!-- [3,3] Prediction×Prediction: 0.978, op=0.978 -->
  <rect x="524" y="324" width="130" height="70" fill="#2d5a4f" opacity="0.978" rx="2"/>

  <!-- Grid lines between cells -->
  <g stroke="#faf8f5" stroke-width="1.5" opacity="0.6">
    <line x1="264" y1="114" x2="264" y2="394"/>
    <line x1="394" y1="114" x2="394" y2="394"/>
    <line x1="524" y1="114" x2="524" y2="394"/>
    <line x1="134" y1="184" x2="654" y2="184"/>
    <line x1="134" y1="254" x2="654" y2="254"/>
    <line x1="134" y1="324" x2="654" y2="324"/>
  </g>

  <!-- Value labels in cells -->
  <g font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle">
    <!-- Row 0 -->
    <text x="199" y="149" fill="#faf8f5">0.941</text>
    <text x="329" y="149" fill="#1e3a2b">0.620</text>
    <text x="459" y="149" fill="#1e3a2b" opacity="0.5">0.390</text>
    <text x="589" y="149" fill="#1e3a2b" opacity="0.35">0.350</text>
    <!-- Row 1 -->
    <text x="199" y="219" fill="#1e3a2b">0.580</text>
    <text x="329" y="219" fill="#faf8f5">0.967</text>
    <text x="459" y="219" fill="#1e3a2b">0.700</text>
    <text x="589" y="219" fill="#1e3a2b" opacity="0.5">0.440</text>
    <!-- Row 2 (Entity) -->
    <text x="199" y="289" fill="#1e3a2b" opacity="0.5">0.410</text>
    <text x="329" y="289" fill="#1e3a2b">0.650</text>
    <text x="459" y="289" fill="#faf8f5" font-size="14">0.992</text>
    <text x="589" y="289" fill="#faf8f5">0.780</text>
    <!-- Row 3 -->
    <text x="199" y="359" fill="#1e3a2b" opacity="0.35">0.350</text>
    <text x="329" y="359" fill="#1e3a2b" opacity="0.5">0.420</text>
    <text x="459" y="359" fill="#1e3a2b">0.710</text>
    <text x="589" y="359" fill="#faf8f5">0.978</text>
  </g>

  <!-- Peak annotation arrow -->
  <text x="459" y="233" text-anchor="middle" font-size="10" fill="#f3c98f" font-weight="700">↓ Peak</text>

  <!-- Color scale legend -->
  <defs>
    <linearGradient id="scale-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#faf8f5"/>
      <stop offset="100%" stop-color="#2d5a4f"/>
    </linearGradient>
  </defs>
  <rect x="160" y="418" width="200" height="12" fill="url(#scale-grad)" rx="2" stroke="#d4c8b0" stroke-width="0.5"/>
  <text x="160" y="414" font-size="10" fill="#8a7d68">0.35</text>
  <text x="362" y="414" text-anchor="end" font-size="10" fill="#8a7d68">1.00</text>
  <text x="280" y="446" text-anchor="middle" font-size="10" fill="#6b5d4f" font-style="italic">CKA similarity</text>
</svg>
