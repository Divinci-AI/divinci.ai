<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'DM Sans', -apple-system, sans-serif" role="img" aria-label="Horizontal bar chart of retrieval-gate accuracy against measured ground truth on 38 points. The classifier scored blind reaches 0.632, the classifier told the operator's domain reaches 0.632, and always answering no reaches 0.632 — all three identical to the majority-class baseline. The retriever's own top-1 BM25 score reaches 0.921 and its top-1 cosine score reaches 1.000, holding at 1.000 under leave-one-out cross-validation.">
  <title>Retrieval-gate accuracy — the classifier sits exactly at the majority-class baseline</title>
  <rect width="900" height="380" fill="#faf8f5"/>

  <text x="60" y="34" font-size="16" font-weight="700" fill="#1e3a2b">Three ways of asking the classifier, one answer: the baseline</text>
  <text x="60" y="54" font-size="12" fill="#6b5d4f">38 query-corpus pairs, relevance known by construction. Internal, measured by us.</text>

  <g font-size="10" fill="#8a7d68">
    <text x="300" y="316" text-anchor="middle">0</text>
    <text x="420" y="316" text-anchor="middle">0.25</text>
    <text x="540" y="316" text-anchor="middle">0.50</text>
    <text x="660" y="316" text-anchor="middle">0.75</text>
    <text x="780" y="316" text-anchor="middle">1.00</text>
    <text x="540" y="338" text-anchor="middle" font-size="11" fill="#6b5d4f">accuracy against measured truth</text>
  </g>
  <g stroke="#d4c8b0" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.6">
    <line x1="420" y1="72" x2="420" y2="300"/>
    <line x1="540" y1="72" x2="540" y2="300"/>
    <line x1="660" y1="72" x2="660" y2="300"/>
    <line x1="780" y1="72" x2="780" y2="300"/>
  </g>

  <line x1="300" y1="300" x2="300" y2="72" stroke="#2d3c34" stroke-width="1.5"/>
  <line x1="300" y1="300" x2="820" y2="300" stroke="#2d3c34" stroke-width="1.5"/>

  <line x1="603" y1="66" x2="603" y2="300" stroke="#a04848" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="609" y="64" font-size="11" font-weight="700" fill="#a04848">majority-class baseline 0.632</text>

  <g font-size="11" fill="#2d3c34">
    <text x="292" y="99" text-anchor="end">always answer "no"</text>
    <text x="292" y="139" text-anchor="end">classifier, blind</text>
    <text x="292" y="179" text-anchor="end">classifier, told the domain</text>
    <text x="292" y="219" text-anchor="end" font-weight="700" fill="#2d5a4f">retriever, top-1 BM25</text>
    <text x="292" y="259" text-anchor="end" font-weight="700" fill="#2d5a4f">retriever, top-1 cosine</text>
  </g>

  <g>
    <rect x="300" y="82" width="303" height="24" fill="#d5c8ae" rx="1"/>
    <rect x="300" y="122" width="303" height="24" fill="#b8a080" rx="1"/>
    <rect x="300" y="162" width="303" height="24" fill="#b8a080" rx="1"/>
    <rect x="300" y="202" width="442" height="24" fill="#3d6b4f" rx="1"/>
    <rect x="300" y="242" width="480" height="24" fill="#2d5a4f" rx="1"/>
  </g>

  <g font-size="11" font-weight="700" fill="#1e3a2b">
    <text x="611" y="99">0.632</text>
    <text x="611" y="139">0.632</text>
    <text x="611" y="179">0.632</text>
    <text x="750" y="219">0.921</text>
    <text x="788" y="259">1.000</text>
  </g>

  <text x="60" y="364" font-size="11" fill="#6b5d4f">Under leave-one-out, refitting the cut for every held-out point: cosine 38/38, BM25 32/38. Cosine survives; BM25 does not.</text>
</svg>
