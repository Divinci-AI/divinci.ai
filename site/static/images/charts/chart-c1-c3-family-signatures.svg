<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="'DM Sans', -apple-system, sans-serif" role="img" aria-label="Scatter plot of C1 sparsity vs C3 gate coherence — Gemma and Llama lineages cluster at high coherence, Qwen3-0.6B sits low">
  <title>C1 × C3 — Family Signatures in Sparsity / Coherence Space</title>
  <rect width="760" height="480" fill="#faf8f5"/>

  <!-- Title -->
  <text x="40" y="36" font-size="16" font-weight="700" fill="#1e3a2b">C1 × C3 — Sparsity vs Gate Coherence</text>
  <text x="40" y="56" font-size="12" fill="#6b5d4f">Each model's training family leaves a fingerprint — coherence ≥0.80 separates Gemma/Llama from Qwen3-small</text>

  <!-- Axis frame. Plot area: x=110-700 (590 wide), y=100-410 (310 tall)
       X (C1 sparsity): 0.00 → 0.45.  px(c1) = 110 + c1 * (590/0.45) = 110 + c1*1311.1
       Y (C3 coherence): 0.50 → 0.85.  py(c3) = 410 - (c3 - 0.50) * (310/0.35) = 410 - (c3-0.5)*885.7 -->
  <g stroke="#d4c8b0" font-size="10" fill="#1e3a2b">
    <!-- Axes -->
    <line x1="110" y1="410" x2="700" y2="410" stroke="#2d3c34" stroke-width="1.2"/>
    <line x1="110" y1="100" x2="110" y2="410" stroke="#2d3c34" stroke-width="1.2"/>

    <!-- X gridlines + labels: 0.0 → 0.4 step 0.1 -->
    <line x1="110" y1="100" x2="110" y2="412"/>
    <text stroke="none" x="110" y="428" text-anchor="middle">0.0</text>
    <line x1="241" y1="100" x2="241" y2="412"/>
    <text stroke="none" x="241" y="428" text-anchor="middle">0.1</text>
    <line x1="372" y1="100" x2="372" y2="412"/>
    <text stroke="none" x="372" y="428" text-anchor="middle">0.2</text>
    <line x1="503" y1="100" x2="503" y2="412"/>
    <text stroke="none" x="503" y="428" text-anchor="middle">0.3</text>
    <line x1="634" y1="100" x2="634" y2="412"/>
    <text stroke="none" x="634" y="428" text-anchor="middle">0.4</text>
    <text stroke="none" x="405" y="450" text-anchor="middle" font-size="11" fill="#6b5d4f" font-style="italic">C1 — FFN activation sparsity →</text>

    <!-- Y gridlines + labels: 0.50 → 0.85 step 0.05 -->
    <line x1="108" y1="410" x2="700" y2="410" stroke="#d4c8b0"/>
    <text stroke="none" x="102" y="414" text-anchor="end">0.50</text>
    <line x1="108" y1="365" x2="700" y2="365" stroke="#d4c8b0" stroke-dasharray="2 4" opacity="0.6"/>
    <text stroke="none" x="102" y="369" text-anchor="end">0.55</text>
    <line x1="108" y1="321" x2="700" y2="321" stroke="#d4c8b0" stroke-dasharray="2 4" opacity="0.6"/>
    <text stroke="none" x="102" y="325" text-anchor="end">0.60</text>
    <line x1="108" y1="277" x2="700" y2="277" stroke="#d4c8b0" stroke-dasharray="2 4" opacity="0.6"/>
    <text stroke="none" x="102" y="281" text-anchor="end">0.65</text>
    <line x1="108" y1="232" x2="700" y2="232" stroke="#d4c8b0" stroke-dasharray="2 4" opacity="0.6"/>
    <text stroke="none" x="102" y="236" text-anchor="end">0.70</text>
    <line x1="108" y1="188" x2="700" y2="188" stroke="#d4c8b0" stroke-dasharray="2 4" opacity="0.6"/>
    <text stroke="none" x="102" y="192" text-anchor="end">0.75</text>
    <line x1="108" y1="144" x2="700" y2="144" stroke="#d4c8b0" stroke-dasharray="2 4" opacity="0.6"/>
    <text stroke="none" x="102" y="148" text-anchor="end">0.80</text>
    <line x1="108" y1="100" x2="700" y2="100" stroke="#d4c8b0" stroke-dasharray="2 4" opacity="0.6"/>
    <text stroke="none" x="102" y="104" text-anchor="end">0.85</text>
    <text stroke="none" x="48" y="255" text-anchor="middle" font-size="11" fill="#6b5d4f" font-style="italic" transform="rotate(-90 48 255)">↑ C3 — gate coherence</text>
  </g>

  <!-- "High coherence cluster" highlight band: y(0.80) ≈ 144 → y(0.815) ≈ 131 -->
  <rect x="110" y="120" width="590" height="44" fill="#2d5a4f" opacity="0.06"/>
  <text x="690" y="115" font-size="10" fill="#2d5a4f" text-anchor="end" font-style="italic">≥ 0.80 cluster — Gemma · Llama · Qwen3-large</text>

  <!-- Data points. Map values:
       Gemma4-E2B-it   C1=0.061 C3=0.801 → x=190, y=143
       MedGemma-1.5-4B C1=0.181 C3=0.800 → x=347, y=144
       Ministral-3B    C1=0.236 C3=0.724 → x=419, y=212
       Qwen3-8B        C1=0.228 C3=0.813 → x=409, y=132
       Llama 3.1-8B    C1=0.387 C3=0.808 → x=618, y=137
       Qwen3-0.6B      C1=0.117 C3=0.531 → x=263, y=383   -->

  <g font-size="11">
    <!-- Gemma4-E2B-it -->
    <circle cx="190" cy="143" r="9" fill="#2d5a4f" stroke="#faf8f5" stroke-width="2"/>
    <text x="190" y="128" text-anchor="middle" fill="#1e3a2b" font-weight="600">Gemma4-E2B</text>

    <!-- MedGemma -->
    <circle cx="347" cy="144" r="9" fill="#2d5a4f" stroke="#faf8f5" stroke-width="2"/>
    <text x="347" y="128" text-anchor="middle" fill="#1e3a2b" font-weight="600">MedGemma 4B</text>

    <!-- Ministral-3B -->
    <circle cx="419" cy="212" r="9" fill="#5a8a7f" stroke="#faf8f5" stroke-width="2"/>
    <text x="419" y="201" text-anchor="middle" fill="#1e3a2b" font-weight="600">Ministral-3B</text>

    <!-- Qwen3-8B -->
    <circle cx="409" cy="132" r="9" fill="#c08850" stroke="#faf8f5" stroke-width="2"/>
    <text x="475" y="135" text-anchor="start" fill="#8a5a20" font-weight="600">Qwen3-8B</text>

    <!-- Llama 3.1-8B -->
    <circle cx="618" cy="137" r="9" fill="#3a6b8a" stroke="#faf8f5" stroke-width="2"/>
    <text x="618" y="124" text-anchor="middle" fill="#1e3a2b" font-weight="600">Llama 3.1-8B</text>

    <!-- Qwen3-0.6B (the outlier — pulls the family signature into view) -->
    <circle cx="263" cy="383" r="9" fill="#c08850" stroke="#faf8f5" stroke-width="2"/>
    <text x="263" y="372" text-anchor="middle" fill="#8a5a20" font-weight="600">Qwen3-0.6B</text>
    <!-- Annotation arrow to the high-coherence band -->
    <path d="M 265 372 Q 305 280 405 165" stroke="#c08850" stroke-width="1" fill="none" stroke-dasharray="2 3" opacity="0.6"/>
    <text x="285" y="328" font-size="10" fill="#8a5a20" font-style="italic">small Qwen3 has</text>
    <text x="285" y="344" font-size="10" fill="#8a5a20" font-style="italic">distinctly low coherence</text>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#4a3a2a">
    <circle cx="120" cy="466" r="6" fill="#2d5a4f"/>
    <text x="135" y="470">Gemma family</text>
    <circle cx="245" cy="466" r="6" fill="#3a6b8a"/>
    <text x="260" y="470">Llama family</text>
    <circle cx="350" cy="466" r="6" fill="#5a8a7f"/>
    <text x="365" y="470">Mistral family</text>
    <circle cx="475" cy="466" r="6" fill="#c08850"/>
    <text x="490" y="470">Qwen3 family</text>
  </g>
</svg>
