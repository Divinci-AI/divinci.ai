<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="'DM Sans', -apple-system, sans-serif" role="img" aria-label="Bar chart of DFlash speculative-decoding speedups on stock Gemma 4 31B vs our DFO QLoRA fine-tune. On the mixed-prompt average the stock target gets 1.28x and the DFO target gets 1.18x (92 percent retention). On the math-reasoning peak prompt the stock target gets 4.4x and the DFO target gets 4.0x (91 percent retention).">
  <title>DFlash Speedup — Stock Target vs DFO Fine-tune</title>
  <rect width="760" height="460" fill="#faf8f5"/>

  <!-- Title -->
  <text x="40" y="36" font-size="16" font-weight="700" fill="#1e3a2b">DFlash speedup retained on a fine-tuned target</text>
  <text x="40" y="56" font-size="12" fill="#6b5d4f">Stock-trained DFlash drafter, dropped on QLoRA-merged DFO target — 92% of the published speedup, no retraining</text>

  <!-- Axis (linear, 0x → 5x).  px(v) = 200 + v * 92.  So 0→200, 1→292, 2→384, 3→476, 4→568, 5→660 -->
  <g stroke="#d4c8b0" stroke-width="1" font-size="10" fill="#3a2818">
    <line x1="200" y1="370" x2="660" y2="370" stroke="#2d3c34" stroke-width="1.2"/>
    <line x1="200" y1="80" x2="200" y2="370"/>
    <!-- Gridlines at 1x intervals -->
    <line x1="292" y1="80" x2="292" y2="370" opacity="0.4"/>
    <line x1="384" y1="80" x2="384" y2="370" opacity="0.4"/>
    <line x1="476" y1="80" x2="476" y2="370" opacity="0.4"/>
    <line x1="568" y1="80" x2="568" y2="370" opacity="0.4"/>
    <line x1="660" y1="80" x2="660" y2="370" opacity="0.4"/>
    <!-- 1x baseline marker (no-DFlash reference) -->
    <line x1="292" y1="80" x2="292" y2="370" stroke="#a04848" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.55"/>
    <text stroke="none" x="292" y="76" font-size="10" fill="#7a2828" text-anchor="middle" font-weight="700" opacity="0.85">1× = no DFlash</text>
    <text stroke="none" x="200" y="388" text-anchor="middle">0×</text>
    <text stroke="none" x="292" y="388" text-anchor="middle">1×</text>
    <text stroke="none" x="384" y="388" text-anchor="middle">2×</text>
    <text stroke="none" x="476" y="388" text-anchor="middle">3×</text>
    <text stroke="none" x="568" y="388" text-anchor="middle">4×</text>
    <text stroke="none" x="660" y="388" text-anchor="middle">5×</text>
    <text stroke="none" x="430" y="408" text-anchor="middle" font-size="11" fill="#6b5d4f" font-style="italic">throughput multiplier vs same target without DFlash →</text>
  </g>

  <!-- Bars: 4 rows in 2 groups (Mixed / Math-peak), pair height 32, gap 18 between pairs -->
  <g font-size="11">
    <!-- Group A: Mixed average -->
    <text x="190" y="115" text-anchor="end" fill="#2d3c34" font-weight="700">Mixed average</text>
    <text x="190" y="129" text-anchor="end" fill="#8a7d68" font-size="10">(10 prompts)</text>
    <!-- Stock target: 1.28x → bar from 200 (0x) to 200+1.28*92 = 317.76 -->
    <rect x="200" y="100" width="118" height="22" fill="#5a8a7f"/>
    <text x="170" y="115" text-anchor="end" fill="#4a3a2a" font-size="10">stock target</text>
    <text x="324" y="116" fill="#2d5a4f" font-weight="700">1.28×</text>
    <!-- DFO target: 1.18x → 200+1.18*92 = 308.56 -->
    <rect x="200" y="124" width="109" height="22" fill="#2d5a4f"/>
    <text x="170" y="139" text-anchor="end" fill="#1e3a2b" font-size="10" font-weight="600">DFO target</text>
    <text x="315" y="140" fill="#1e3a2b" font-weight="700">1.18×</text>

    <!-- Retention badge for Group A -->
    <g transform="translate(380, 110)">
      <rect x="0" y="0" width="98" height="34" rx="4" fill="#2d5a4f" opacity="0.08"/>
      <text x="49" y="14" text-anchor="middle" font-size="10" fill="#2d5a4f">retention</text>
      <text x="49" y="29" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a2b">92%</text>
    </g>

    <!-- Group B: Math reasoning peak -->
    <text x="190" y="195" text-anchor="end" fill="#2d3c34" font-weight="700">Math reasoning peak</text>
    <text x="190" y="209" text-anchor="end" fill="#8a7d68" font-size="10">(prompt 4 — sharp distribution)</text>
    <!-- Stock target: 4.4x → 200+4.4*92 = 604.8 -->
    <rect x="200" y="180" width="405" height="22" fill="#5a8a7f"/>
    <text x="170" y="195" text-anchor="end" fill="#4a3a2a" font-size="10">stock target</text>
    <text x="611" y="196" fill="#2d5a4f" font-weight="700">4.4×</text>
    <!-- DFO target: 4.0x → 200+4.0*92 = 568 -->
    <rect x="200" y="204" width="368" height="22" fill="#2d5a4f"/>
    <text x="170" y="219" text-anchor="end" fill="#1e3a2b" font-size="10" font-weight="600">DFO target</text>
    <text x="574" y="220" fill="#1e3a2b" font-weight="700">4.0×</text>

    <!-- Retention badge for Group B -->
    <g transform="translate(620, 190)">
      <rect x="0" y="0" width="98" height="34" rx="4" fill="#2d5a4f" opacity="0.08"/>
      <text x="49" y="14" text-anchor="middle" font-size="10" fill="#2d5a4f">retention</text>
      <text x="49" y="29" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a2b">91%</text>
    </g>

    <!-- Quality footer band -->
    <g transform="translate(200, 270)">
      <rect x="0" y="0" width="460" height="58" rx="6" fill="#2d5a4f" opacity="0.05" stroke="#5a8a7f" stroke-width="0.8" stroke-dasharray="3 3" opacity-bonus="1"/>
      <text x="14" y="22" font-size="11" font-weight="700" fill="#1e3a2b">Quality cost: 0</text>
      <text x="14" y="40" font-size="10" fill="#4a3a2a">Spec-decode is verifier-lossless. Output bit-identical to running the target alone.</text>
      <text x="14" y="54" font-size="10" fill="#4a3a2a" font-style="italic">Speedup is a strict throughput improvement.</text>
    </g>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#4a3a2a">
    <rect x="200" y="343" width="14" height="14" fill="#5a8a7f"/>
    <text x="220" y="355">stock Gemma 4 31B Instruct (z-lab's training target)</text>
    <rect x="450" y="343" width="14" height="14" fill="#2d5a4f"/>
    <text x="470" y="355">DFO QLoRA target (this experiment)</text>
  </g>

  <!-- Caption -->
  <text x="40" y="438" font-size="11" fill="#6b5d4f" font-style="italic">Modal H100-80GB · vLLM nightly with our backend-override patch · 10 prompts · temperature=0.0 · max_new_tokens=256.</text>
</svg>
