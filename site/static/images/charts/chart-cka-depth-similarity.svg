<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="'DM Sans', -apple-system, sans-serif" role="img" aria-label="CKA representational similarity between Gemma4-E2B and Qwen3-8B at matched normalized depth. Similarity peaks at 0.992 at the entity commitment layer around 55% depth, then falls to 0.49 for mismatched off-diagonal comparisons.">
  <title>CKA Similarity — Gemma4-E2B ↔ Qwen3-8B — Matched Normalized Depth</title>
  <rect width="760" height="460" fill="#faf8f5"/>

  <!-- Title -->
  <text x="80" y="34" font-size="16" font-weight="700" fill="#1e3a2b">CKA Representational Similarity at Matched Normalized Depth</text>
  <text x="80" y="54" font-size="12" fill="#6b5d4f">Gemma4-E2B-it ↔ Qwen3-8B · 256 prompts · similarity peaks at the entity commitment layer</text>

  <!-- Entity layer highlight band (45–65% depth) -->
  <rect x="359" y="72" width="124" height="296" fill="#2d5a4f" opacity="0.07" rx="2"/>

  <!-- Axes -->
  <line x1="80" y1="368" x2="700" y2="368" stroke="#2d3c34" stroke-width="1.5"/>
  <line x1="80" y1="72" x2="80" y2="368" stroke="#2d3c34" stroke-width="1.5"/>

  <!-- Y-axis gridlines and labels (range 0.40 to 1.00, 280px) -->
  <!-- y(v) = 368 - (v - 0.40) / 0.60 * 296 -->
  <g font-size="10" fill="#1e3a2b" stroke="#d4c8b0" stroke-width="0.8">
    <line x1="76" y1="368" x2="700" y2="368" stroke-dasharray="2 4" opacity="0.5"/>
    <text stroke="none" x="72" y="372" text-anchor="end">0.40</text>
    <line x1="76" y1="319" x2="700" y2="319" stroke-dasharray="2 4" opacity="0.5"/>
    <text stroke="none" x="72" y="323" text-anchor="end">0.50</text>
    <line x1="76" y1="269" x2="700" y2="269" stroke-dasharray="2 4" opacity="0.5"/>
    <text stroke="none" x="72" y="273" text-anchor="end">0.60</text>
    <line x1="76" y1="220" x2="700" y2="220" stroke-dasharray="2 4" opacity="0.5"/>
    <text stroke="none" x="72" y="224" text-anchor="end">0.70</text>
    <line x1="76" y1="171" x2="700" y2="171" stroke-dasharray="2 4" opacity="0.5"/>
    <text stroke="none" x="72" y="175" text-anchor="end">0.80</text>
    <line x1="76" y1="122" x2="700" y2="122" stroke-dasharray="2 4" opacity="0.5"/>
    <text stroke="none" x="72" y="126" text-anchor="end">0.90</text>
    <line x1="76" y1="72" x2="700" y2="72" stroke-dasharray="2 4" opacity="0.4"/>
    <text stroke="none" x="72" y="76" text-anchor="end">1.00</text>
  </g>

  <!-- X-axis tick labels (drop 60% to avoid collision with highlighted 55%) -->
  <g font-size="10" fill="#8a7d68">
    <text x="80" y="384" text-anchor="middle">0%</text>
    <line x1="80" y1="368" x2="80" y2="374" stroke="#8a7d68"/>
    <text x="204" y="384" text-anchor="middle">20%</text>
    <line x1="204" y1="368" x2="204" y2="374" stroke="#8a7d68"/>
    <text x="328" y="384" text-anchor="middle">40%</text>
    <line x1="328" y1="368" x2="328" y2="374" stroke="#8a7d68"/>
    <text x="421" y="384" text-anchor="middle" font-weight="700" fill="#2d5a4f">55%</text>
    <line x1="421" y1="368" x2="421" y2="376" stroke="#2d5a4f" stroke-width="1.5"/>
    <line x1="452" y1="368" x2="452" y2="372" stroke="#8a7d68"/>
    <text x="576" y="384" text-anchor="middle">80%</text>
    <line x1="576" y1="368" x2="576" y2="374" stroke="#8a7d68"/>
    <text x="700" y="384" text-anchor="middle">100%</text>
    <line x1="700" y1="368" x2="700" y2="374" stroke="#8a7d68"/>
    <text x="390" y="408" text-anchor="middle" font-size="11" fill="#6b5d4f" font-style="italic">Normalized depth (% of model layers) →</text>
  </g>

  <!-- Off-diagonal reference line + inline label (centered above the line) -->
  <line x1="80" y1="324" x2="700" y2="324" stroke="#8a7d68" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  <text x="390" y="318" text-anchor="middle" font-size="10.5" fill="#8a7d68" font-style="italic">Off-diagonal baseline (±15% depth mismatch) · ~0.49</text>

  <!-- Area fill under the main curve -->
  <path d="M 80,368 L 111,111 C 132,111 152,104 173,104 C 194,104 215,96 235,96 C 256,96 276,88 297,88 C 318,88 339,82 359,82 C 380,82 401,76 421,76 C 442,76 462,80 483,80 C 504,80 524,82 545,82 C 566,82 586,83 607,83 C 628,83 649,91 669,91 L 700,368 Z" fill="#2d5a4f" opacity="0.08"/>

  <!-- Main curve: Gemma4 ↔ Qwen3 matched-depth CKA -->
  <path d="M 111,111 C 132,111 152,104 173,104 C 194,104 215,96 235,96 C 256,96 276,88 297,88 C 318,88 339,82 359,82 C 380,82 401,76 421,76 C 442,76 462,80 483,80 C 504,80 524,82 545,82 C 566,82 586,83 607,83 C 628,83 649,91 669,91" fill="none" stroke="#2d5a4f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inline curve label, placed in the empty lower-left interior -->
  <text x="92" y="208" font-size="11.5" fill="#2d5a4f" font-weight="600">Gemma4-E2B ↔ Qwen3-8B</text>
  <text x="92" y="224" font-size="10.5" fill="#6b5d4f" font-style="italic">CKA at matched normalized depth</text>

  <!-- Data point dots -->
  <g fill="#2d5a4f" stroke="#faf8f5" stroke-width="1.5">
    <circle cx="111" cy="111" r="4"/>
    <circle cx="173" cy="104" r="4"/>
    <circle cx="235" cy="96" r="4"/>
    <circle cx="297" cy="88" r="4"/>
    <circle cx="359" cy="82" r="4"/>
    <circle cx="421" cy="76" r="6"/>
    <circle cx="483" cy="80" r="4"/>
    <circle cx="545" cy="82" r="4"/>
    <circle cx="607" cy="83" r="4"/>
    <circle cx="669" cy="91" r="4"/>
  </g>

  <!-- Peak callout: angled leader from peak (421,76) to a clean label area in upper-right empty space -->
  <path d="M 427,77 Q 462,92 498,128" fill="none" stroke="#1e3a2b" stroke-width="0.9" opacity="0.55"/>
  <circle cx="498" cy="128" r="2" fill="#1e3a2b" opacity="0.55"/>
  <text x="506" y="132" font-size="13" font-weight="700" fill="#1e3a2b">0.992 peak</text>
  <text x="506" y="148" font-size="10.5" fill="#4a3a2a" font-style="italic">at entity commitment layer (~55% depth)</text>

  <!-- Endpoint value labels -->
  <text x="111" y="101" text-anchor="middle" font-size="10" fill="#4a3a2a">0.920</text>
  <text x="669" y="81" text-anchor="middle" font-size="10" fill="#4a3a2a">0.961</text>

  <!-- Stage zone labels below X axis -->
  <g font-size="10" fill="#4a3a2a" font-style="italic">
    <text x="140" y="424" text-anchor="middle">Broadcast</text>
    <text x="266" y="424" text-anchor="middle">Domain</text>
    <text x="421" y="424" text-anchor="middle" font-weight="700" fill="#2d5a4f">Entity</text>
    <text x="607" y="424" text-anchor="middle">Prediction</text>
  </g>
</svg>
