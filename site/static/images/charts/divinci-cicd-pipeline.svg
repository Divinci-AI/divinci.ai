<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'DM Sans', -apple-system, sans-serif" role="img" aria-label="Four-stage CI/CD pipeline: Register, Gate, Roll, Observe. Each stage signs an entry in the audit log and either advances to the next stage or rolls back atomically via the bundled release manifest.">
  <title>Divinci AI — The four-stage release pipeline</title>
  <rect width="900" height="380" fill="#faf8f5"/>

  <!-- Title -->
  <text x="40" y="36" font-size="16" font-weight="700" fill="#1e3a2b">The Divinci release pipeline</text>
  <text x="40" y="56" font-size="12" fill="#6b5d4f">Four sequential stages. Every advance is signed. Every step has a rollback path that does not require a human.</text>

  <!-- Pipeline flow: 4 stage boxes left-to-right, connected by arrows -->
  <!-- Each stage: 175px wide, 130px tall, ~30px gap -->
  <!-- Y center for boxes: 145, so y=80 -->

  <!-- Stage 1: Register -->
  <g>
    <rect x="40" y="90" width="180" height="140" rx="8" fill="#ffffff" stroke="#2d5a4f" stroke-width="1.5"/>
    <rect x="40" y="90" width="180" height="28" rx="8" fill="#2d5a4f"/>
    <rect x="40" y="110" width="180" height="8" fill="#2d5a4f"/>
    <text x="130" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#faf8f5">1 — REGISTER</text>
    <text x="55" y="140" font-size="11" fill="#1e3a2b" font-weight="600">Release manifest</text>
    <text x="55" y="158" font-size="10" fill="#6b5d4f">• model_ref @ SHA</text>
    <text x="55" y="174" font-size="10" fill="#6b5d4f">• prompt_template_ref</text>
    <text x="55" y="190" font-size="10" fill="#6b5d4f">• routing rules</text>
    <text x="55" y="206" font-size="10" fill="#6b5d4f">• dataset_version</text>
    <text x="55" y="222" font-size="10" fill="#6b5d4f">• previous_release</text>
  </g>

  <!-- Arrow 1→2 -->
  <g stroke="#b8a080" stroke-width="2" fill="none">
    <line x1="220" y1="160" x2="248" y2="160"/>
    <polygon points="248,154 260,160 248,166" fill="#b8a080" stroke="none"/>
  </g>

  <!-- Stage 2: Gate -->
  <g>
    <rect x="260" y="90" width="180" height="140" rx="8" fill="#ffffff" stroke="#2d5a4f" stroke-width="1.5"/>
    <rect x="260" y="90" width="180" height="28" rx="8" fill="#2d5a4f"/>
    <rect x="260" y="110" width="180" height="8" fill="#2d5a4f"/>
    <text x="350" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#faf8f5">2 — GATE</text>
    <text x="275" y="140" font-size="11" fill="#1e3a2b" font-weight="600">Per-category eval</text>
    <text x="275" y="158" font-size="10" fill="#6b5d4f">scored-QA suite</text>
    <text x="275" y="174" font-size="10" fill="#6b5d4f">Spearman ρ ≥ threshold</text>
    <text x="275" y="190" font-size="10" fill="#6b5d4f">per subdomain</text>
    <text x="275" y="212" font-size="10" fill="#a04848" font-style="italic">fail → archive,</text>
    <text x="275" y="225" font-size="10" fill="#a04848" font-style="italic">deploy rejected</text>
  </g>

  <!-- Arrow 2→3 -->
  <g stroke="#b8a080" stroke-width="2" fill="none">
    <line x1="440" y1="160" x2="468" y2="160"/>
    <polygon points="468,154 480,160 468,166" fill="#b8a080" stroke="none"/>
  </g>

  <!-- Stage 3: Roll -->
  <g>
    <rect x="480" y="90" width="180" height="140" rx="8" fill="#ffffff" stroke="#2d5a4f" stroke-width="1.5"/>
    <rect x="480" y="90" width="180" height="28" rx="8" fill="#2d5a4f"/>
    <rect x="480" y="110" width="180" height="8" fill="#2d5a4f"/>
    <text x="570" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#faf8f5">3 — ROLL</text>
    <text x="495" y="140" font-size="11" fill="#1e3a2b" font-weight="600">Canary checkpoints</text>
    <text x="495" y="158" font-size="10" fill="#6b5d4f">5% → 25% → 100%</text>
    <text x="495" y="174" font-size="10" fill="#6b5d4f">At each:</text>
    <text x="505" y="190" font-size="10" fill="#6b5d4f">– p95 latency ≤ 1.2×</text>
    <text x="505" y="206" font-size="10" fill="#6b5d4f">– 5xx rate ≤ 1.5×</text>
    <text x="505" y="222" font-size="10" fill="#6b5d4f">– output-quality monitor</text>
  </g>

  <!-- Arrow 3→4 -->
  <g stroke="#b8a080" stroke-width="2" fill="none">
    <line x1="660" y1="160" x2="688" y2="160"/>
    <polygon points="688,154 700,160 688,166" fill="#b8a080" stroke="none"/>
  </g>

  <!-- Stage 4: Observe -->
  <g>
    <rect x="700" y="90" width="180" height="140" rx="8" fill="#ffffff" stroke="#2d5a4f" stroke-width="1.5"/>
    <rect x="700" y="90" width="180" height="28" rx="8" fill="#2d5a4f"/>
    <rect x="700" y="110" width="180" height="8" fill="#2d5a4f"/>
    <text x="790" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#faf8f5">4 — OBSERVE</text>
    <text x="715" y="140" font-size="11" fill="#1e3a2b" font-weight="600">Continuous monitor</text>
    <text x="715" y="158" font-size="10" fill="#6b5d4f">Per-minute quality</text>
    <text x="715" y="174" font-size="10" fill="#6b5d4f">on 5% traffic sample</text>
    <text x="715" y="196" font-size="10" fill="#a04848" font-weight="600">3 consecutive minutes</text>
    <text x="715" y="210" font-size="10" fill="#a04848" font-weight="600">below threshold →</text>
    <text x="715" y="224" font-size="10" fill="#a04848" font-weight="600">auto-rollback (12 s)</text>
  </g>

  <!-- Rollback path: curved arrow from Observe back to Register -->
  <g stroke="#a04848" stroke-width="1.5" fill="none" stroke-dasharray="5 4" opacity="0.65">
    <path d="M 790 235 Q 790 295 460 295 Q 130 295 130 235"/>
    <polygon points="124,225 130,237 136,225" fill="#a04848" stroke="none" opacity="0.9"/>
  </g>
  <text x="460" y="313" text-anchor="middle" font-size="11" fill="#a04848" font-style="italic">rollback path — atomic swap to previous_release manifest</text>

  <!-- Audit log strip -->
  <line x1="40" y1="345" x2="880" y2="345" stroke="#b8a080" stroke-width="0.5"/>
  <text x="40" y="365" font-size="10" fill="#8a7d68">Audit log: every stage emits one signed entry. Manifest SHA, user ID, gate result, monitor readings — all addressed by content hash.</text>
</svg>
