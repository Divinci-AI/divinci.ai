<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'DM Sans', -apple-system, sans-serif" role="img" aria-label="Top-8 output concentration rises from 88-94% at 0.6-8B scale to 99.7-100% at frontier MoE scale">
  <title>C2 — Top-8 Output Concentration vs Scale</title>
  <rect width="760" height="360" fill="#faf8f5"/>

  <!-- Title -->
  <text x="40" y="36" font-size="16" font-weight="700" fill="#1e3a2b">C2 — Top-8 token mass at each generation step</text>
  <text x="40" y="56" font-size="12" fill="#6b5d4f">Frontier MoE models converge to &gt;99.7% — sub-2 active tokens per step</text>

  <!-- 100% reference line -->
  <line x1="80" y1="98" x2="720" y2="98" stroke="#2d5a4f" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
  <text x="725" y="102" font-size="10" fill="#2d5a4f">100%</text>

  <!-- Y axis: 80% → 100%, 16 px per pp. y(p) = 98 + (100 - p) * 11 -->
  <g stroke="#d4c8b0" font-size="10" fill="#8a7d68">
    <line x1="80" y1="98" x2="80" y2="318" stroke="#2d3c34" stroke-width="1.2"/>
    <line x1="80" y1="318" x2="720" y2="318" stroke="#2d3c34" stroke-width="1.2"/>
    <line x1="78" y1="318" x2="80" y2="318"/>
    <text x="72" y="322" text-anchor="end">80%</text>
    <line x1="78" y1="263" x2="80" y2="263"/>
    <text x="72" y="267" text-anchor="end">85%</text>
    <line x1="78" y1="208" x2="80" y2="208"/>
    <text x="72" y="212" text-anchor="end">90%</text>
    <line x1="78" y1="153" x2="80" y2="153"/>
    <text x="72" y="157" text-anchor="end">95%</text>
    <line x1="78" y1="98" x2="80" y2="98"/>
    <text x="72" y="102" text-anchor="end">100%</text>
  </g>

  <!-- Bars. width=80, gap=18.  start x=120 -->
  <g font-size="11">
    <!-- Group 1: 0.6–8B range (88-94%) shown as range bar with min/max marks -->
    <rect x="120" y="153" width="80" height="165" fill="#2d5a4f" opacity="0.55"/>
    <!-- Range markers -->
    <line x1="115" y1="219" x2="205" y2="219" stroke="#1e3a2b" stroke-width="2"/>
    <text x="160" y="142" text-anchor="middle" font-weight="600" fill="#1e3a2b">88–94%</text>
    <text x="160" y="338" text-anchor="middle" fill="#4a3a2a">0.6B – 8B</text>
    <text x="160" y="354" text-anchor="middle" font-size="10" fill="#8a7d68">dense, 4 models</text>

    <!-- Group 2: Gemma 4 26B (99.7%) -->
    <rect x="218" y="101" width="80" height="217" fill="#2d5a4f"/>
    <text x="258" y="92" text-anchor="middle" font-weight="600" fill="#1e3a2b">99.7%</text>
    <text x="258" y="338" text-anchor="middle" fill="#4a3a2a">Gemma 4 26B</text>
    <text x="258" y="354" text-anchor="middle" font-size="10" fill="#8a7d68">MoE</text>

    <!-- Group 3: GPT-OSS 120B (99.7%) -->
    <rect x="316" y="101" width="80" height="217" fill="#2d5a4f"/>
    <text x="356" y="92" text-anchor="middle" font-weight="600" fill="#1e3a2b">99.7%</text>
    <text x="356" y="338" text-anchor="middle" fill="#4a3a2a">GPT-OSS 120B</text>
    <text x="356" y="354" text-anchor="middle" font-size="10" fill="#8a7d68">MoE</text>

    <!-- Group 4: Qwen 3 30B A3B (100.0%) -->
    <rect x="414" y="98" width="80" height="220" fill="#1e3a2b"/>
    <text x="454" y="92" text-anchor="middle" font-weight="700" fill="#1e3a2b">100.0%</text>
    <text x="454" y="338" text-anchor="middle" fill="#4a3a2a">Qwen 3 30B A3B</text>
    <text x="454" y="354" text-anchor="middle" font-size="10" fill="#8a7d68">MoE</text>
  </g>

  <!-- Annotation: convergence arrow + caption -->
  <g>
    <path d="M 530 200 L 690 130" stroke="#c08850" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#c08850"/>
      </marker>
    </defs>
    <text x="540" y="230" font-size="11" fill="#8a5a20" font-style="italic">convergence at scale</text>
    <text x="540" y="248" font-size="11" fill="#8a5a20" font-style="italic">→ &lt;2 active tokens / 262K vocab</text>
  </g>
</svg>
