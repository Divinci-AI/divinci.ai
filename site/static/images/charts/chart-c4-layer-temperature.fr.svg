<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'DM Sans', -apple-system, sans-serif" role="img" aria-label="Température de couche C4 sur 7 modèles — Gemma, Mistral, Llama sous 0,05 tandis que la famille Qwen3 se situe à 0,4–0,8 et l'anomalie MedGemma à 1,9">
  <title>Température de couche C4 — Multi-architecture</title>
  <rect width="760" height="420" fill="#faf8f5"/>

  <!-- Title -->
  <text x="40" y="36" font-size="16" font-weight="700" fill="#1e3a2b">C4 — Variance d'activation par couche FFN</text>
  <text x="40" y="56" font-size="12" fill="#6b5d4f">Trois lignées sous 0,05 · Qwen3 élevé · anomalie MedGemma</text>

  <!-- Reference band: "the constant cluster" -->
  <g>
    <rect x="180" y="80" width="38" height="290" fill="#2d5a4f" opacity="0.06"/>
    <line x1="180" y1="80" x2="180" y2="370" stroke="#2d5a4f" stroke-width="1" stroke-dasharray="3 3" opacity="0.45"/>
    <line x1="218" y1="80" x2="218" y2="370" stroke="#2d5a4f" stroke-width="1" stroke-dasharray="3 3" opacity="0.45"/>
    <text x="199" y="76" font-size="10" fill="#2d5a4f" text-anchor="middle" opacity="0.75">amas ~0,04</text>
  </g>

  <!-- X axis (log scale: 0.01 → 2.0). Mapping: x = 180 + (log10(v) - log10(0.01)) * (520/log10(200))
       So values 0.01→180, 0.04→313, 0.1→378, 1.0→520, 2.0→555. We need to scale 0.01→2.0 across 180-700.
       width range = 520, log range = log10(2/0.01) = log10(200) ≈ 2.301
       px(v) = 180 + (log10(v) - log10(0.01)) * 520/2.301 -->
  <g stroke="#d4c8b0" stroke-width="1" font-size="10" fill="#3a2818" font-family="'DM Sans', sans-serif">
    <!-- Gridlines at 0.01, 0.1, 1.0 -->
    <line x1="180" y1="370" x2="700" y2="370" stroke="#2d3c34" stroke-width="1.2"/>
    <line x1="180" y1="80" x2="180" y2="370"/>
    <line x1="406" y1="80" x2="406" y2="370"/>
    <line x1="632" y1="80" x2="632" y2="370"/>
    <text stroke="none" x="180" y="388" text-anchor="middle">0.01</text>
    <text stroke="none" x="406" y="388" text-anchor="middle">0.1</text>
    <text stroke="none" x="632" y="388" text-anchor="middle">1.0</text>
    <text stroke="none" x="440" y="408" text-anchor="middle" font-size="11" fill="#6b5d4f" font-style="italic">C4 (échelle log)</text>
  </g>

  <!-- Bars. Same x-mapping. Bar height 22, gap 10. Y-start 86.
       px(v) = 180 + (log10(v) + 2) * 226 -->
  <g font-size="11">
    <!-- 1. Llama 3.1-8B  C4=0.012 -->
    <text x="170" y="103" text-anchor="end" fill="#2d3c34" font-weight="600">Llama 3.1-8B</text>
    <rect x="180" y="92" width="38" height="22" fill="#2d5a4f"/>
    <text x="223" y="108" fill="#1e3a2b" font-weight="600">0.012</text>

    <!-- 2. Ministral-3B  C4=0.036 -->
    <text x="170" y="135" text-anchor="end" fill="#2d3c34" font-weight="600">Ministral-3B</text>
    <rect x="180" y="124" width="121" height="22" fill="#2d5a4f"/>
    <text x="306" y="140" fill="#1e3a2b" font-weight="600">0.036</text>

    <!-- 3. Gemma4-E2B  C4=0.041 -->
    <text x="170" y="167" text-anchor="end" fill="#2d3c34" font-weight="600">Gemma4-E2B-it</text>
    <rect x="180" y="156" width="134" height="22" fill="#2d5a4f"/>
    <text x="319" y="172" fill="#1e3a2b" font-weight="600">0.041</text>

    <!-- 4. Gemma 4 26B  C4≈0.042 -->
    <text x="170" y="199" text-anchor="end" fill="#2d3c34" font-weight="600">Gemma 4 26B</text>
    <rect x="180" y="188" width="136" height="22" fill="#2d5a4f"/>
    <text x="321" y="204" fill="#1e3a2b" font-weight="600">~0.042</text>

    <!-- 5. Qwen3-0.6B  C4=0.411 -->
    <text x="170" y="231" text-anchor="end" fill="#6b5d4f">Qwen3-0.6B</text>
    <rect x="180" y="220" width="362" height="22" fill="#c08850" opacity="0.85"/>
    <text x="547" y="236" fill="#8a5a20" font-weight="600">0.411</text>

    <!-- 6. Qwen3-8B  C4=0.804 -->
    <text x="170" y="263" text-anchor="end" fill="#6b5d4f">Qwen3-8B (bf16)</text>
    <rect x="180" y="252" width="429" height="22" fill="#c08850" opacity="0.85"/>
    <text x="614" y="268" fill="#8a5a20" font-weight="600">0.804</text>

    <!-- 7. MedGemma-1.5-4B  C4=1.898 (anomalie) -->
    <text x="170" y="295" text-anchor="end" fill="#a04848">MedGemma-1.5-4B</text>
    <rect x="180" y="284" width="513" height="22" fill="#a04848" opacity="0.85"/>
    <text x="698" y="300" fill="#7a2828" font-weight="600">1.898</text>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#4a3a2a">
    <rect x="180" y="333" width="14" height="14" fill="#2d5a4f"/>
    <text x="200" y="345">Invariant Tier 1 (Gemma · Mistral · Llama)</text>
    <rect x="425" y="333" width="14" height="14" fill="#c08850" opacity="0.85"/>
    <text x="445" y="345">Signature famille Qwen3</text>
    <rect x="600" y="333" width="14" height="14" fill="#a04848" opacity="0.85"/>
    <text x="620" y="345">anomalie</text>
  </g>
</svg>
