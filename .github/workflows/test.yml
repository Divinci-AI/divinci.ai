name: Tests

# WHY THIS FILE WAS REWRITTEN (2026-08-28)
#
# The previous version had five jobs and not one of them could run. Every job
# began `npm ci` at the repository root, and there is no package.json there —
# there never has been. It also ran `tests/e2e/`, which targets the PRE-ZOLA
# site (`/pricing.html`, `/about-us.html`) against a server rooted at the repo,
# so those paths stopped existing when the site moved to Zola. It had been red
# on `main` since 2026-08-23 and did not trigger on feature branches, which is
# where the work happens.
#
# The installable harness is `site/`: its own package.json, lockfile,
# playwright.config.js and 65 specs, serving itself with `zola serve`.
#
# TWO JOBS, ON PURPOSE — they cost very different amounts.
#
#   guards  runs on EVERY push. `zola build` plus the build-invariant script,
#           no browser, ~2 minutes. It catches the class of bug that actually
#           shipped here: an image whose CSS filter layer is composited before
#           the image lands paints NOTHING, while `complete`, `naturalWidth`
#           and `checkVisibility()` all report it healthy. No DOM assertion can
#           see that, so `toBeVisible()` passes over an invisible logo.
#
#   e2e     157 Playwright tests. Measured locally at 8.9 min — but with up to
#           12 workers, and playwright.config.js pins `workers: 1` under CI, so
#           the first CI run blew a 30-minute timeout with the E2E step
#           cancelled. It now gets 60 minutes and 2 workers (private-repo
#           runners are 2-core), and runs only where the minutes are worth it:
#           pull requests, main/develop, and on demand. On a private repo the
#           free tier is 2000 minutes a month; a 40-minute suite on every push
#           to every branch would eat that in about 50 pushes.
#
# Ordering note for anyone changing this: the target suite was MEASURED green
# (157 passed, 1 skipped, 0 failed) before being made blocking. Pointing CI at
# an unverified suite is how every branch goes red at once.
#
# The root `tests/` tree and `playwright.config.ts` are left alone — a fossil
# of the pre-Zola site with no package.json to install. Retargeting them would
# mean standing up a second harness beside a working one. See
# `divinci-ai-site-ci-cannot-gate-anything` in the server repo's
# notes/KNOWN-GAPS.yaml.

on:
  push:
    branches: ['**']
    paths:
      - 'site/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  ZOLA_VERSION: '0.19.2'

jobs:
  guards:
    name: Build guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install Zola
        # Pinned rather than "latest": a silent Zola bump would change the
        # rendered HTML the guards assert against.
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin zola
          zola --version

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: zola build

      - name: Build invariants
        # Also runs in the deploy build chain, so this is a second line rather
        # than the only one.
        run: node scripts/check-build-invariants.mjs

  e2e:
    name: E2E (Desktop-Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: guards
    # Not on every feature-branch push: see the cost note at the top.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin zola
          zola --version

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E (Desktop-Chrome)
        # --workers overrides the config's CI value of 1 without editing a file
        # several people are working in. The Mobile-* and Visual-* projects are
        # NOT enabled: they have not been measured, and enabling an unmeasured
        # project is the mistake this rewrite exists to avoid. Mobile-Chrome is
        # the one to measure next.
        run: npx playwright test --project=Desktop-Chrome --workers=2

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: site/test-results/
          retention-days: 7
