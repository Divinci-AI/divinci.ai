name: Tests

# WHY THIS FILE WAS REWRITTEN (2026-08-28)
#
# The previous version had five jobs and not one of them could run. Every job
# began `npm ci` at the repository root, and there is no package.json there —
# there never has been. It also ran `tests/e2e/`, which targets the PRE-ZOLA
# site (`/pricing.html`, `/about-us.html`) against a server rooted at the repo,
# so those paths stopped existing when the site moved to Zola. It had been red
# on `main` since 2026-08-23 and did not trigger on feature branches, which is
# where the work happens.
#
# The installable harness is `site/`: its own package.json, lockfile,
# playwright.config.js and 65 specs, serving itself with `zola serve`.
#
# TWO JOBS, ON PURPOSE — they take very different amounts of wall clock.
#
#   guards  runs on EVERY push. `zola build` plus the build-invariant script,
#           no browser. Measured on main: 0.4-0.5 min. It catches the class of bug that actually
#           shipped here: an image whose CSS filter layer is composited before
#           the image lands paints NOTHING, while `complete`, `naturalWidth`
#           and `checkVisibility()` all report it healthy. No DOM assertion can
#           see that, so `toBeVisible()` passes over an invisible logo.
#
#   e2e     157 Playwright tests, SHARDED. Sizing this took three attempts and
#           two wrong assumptions, both recorded here so nobody repeats them:
#             1. Measured locally at 8.9 min and treated that as the CI cost —
#                but locally Playwright used up to 12 workers, and
#                playwright.config.js pins `workers: 1` under CI. 30-min
#                timeout, cancelled.
#             2. Assumed a private repo: 2-core runners and billed minutes, so
#                --workers=2 and a stingy cadence. Ran 61.8 min against a
#                60-min timeout, cancelled again. This repo is PUBLIC —
#                Actions minutes are free and unlimited, and public repos get
#                4-core runners.
#           So: 3 shards x 4 workers — 17.1/16.8/17.3 min against a 45-min
#           budget, which is the right size.
#
#           But it FAILS in CI, and not because of the sizing. 52 of the 65
#           spec files call `page.waitForLoadState('networkidle')`, several in
#           a beforeEach. On a runner the network never goes idle — the page
#           loads HubSpot, Leadsy and fonts — so those specs time out at 30s,
#           on every shard, on every retry. Deterministic, not flaky.
#
#           Which is why it is workflow_dispatch ONLY. The suite passes 157/157
#           locally; I measured it there and called it "measured green", and
#           local is not where CI runs. Same error as the two above.
#
#           To unblock: replace `networkidle` with a deterministic wait (a
#           locator, or 'domcontentloaded'). Commit 7aa8ff3 already did this
#           for the eight mobile specs — the pattern is there to copy.
#
# Ordering note for anyone changing this: the target suite was MEASURED green
# (157 passed, 1 skipped, 0 failed) before being made blocking. Pointing CI at
# an unverified suite is how every branch goes red at once.
#
# The root `tests/` tree and `playwright.config.ts` are left alone — a fossil
# of the pre-Zola site with no package.json to install. Retargeting them would
# mean standing up a second harness beside a working one. See
# `divinci-ai-site-ci-cannot-gate-anything` in the server repo's
# notes/KNOWN-GAPS.yaml.

on:
  push:
    branches: ['**']
    paths:
      - 'site/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  ZOLA_VERSION: '0.19.2'

jobs:
  guards:
    name: Build guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install Zola
        # Pinned rather than "latest": a silent Zola bump would change the
        # rendered HTML the guards assert against.
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin zola
          zola --version

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: zola build

      - name: Build invariants
        # Also runs in the deploy build chain, so this is a second line rather
        # than the only one.
        run: node scripts/check-build-invariants.mjs

  e2e:
    name: E2E ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: guards
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # ON-DEMAND ONLY, until the suite is CI-stable. See the note at the top:
    # 52 of the 65 spec files wait for `networkidle`, which never arrives on a
    # runner, so this fails deterministically — not flakily — in CI. Wiring it
    # to push or pull_request would paint main and every PR red on a
    # pre-existing condition, which is the exact failure this rewrite set out
    # to remove. Run it with `gh workflow run test.yml` while fixing specs.
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin zola
          zola --version

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E (Desktop-Chrome) shard ${{ matrix.shard }}/3
        # --workers overrides the config's CI value of 1 without editing a file
        # several people are working in. 4 workers because public-repo runners
        # are 4-core; the whole suite at 2 workers took 61.8 min and timed out.
        #
        # The Mobile-* and Visual-* projects are NOT enabled: they have not
        # been measured, and enabling an unmeasured project is the mistake this
        # rewrite exists to avoid. Mobile-Chrome is the one to measure next.
        run: npx playwright test --project=Desktop-Chrome --workers=4 --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: site/test-results/
          retention-days: 7
