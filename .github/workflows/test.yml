name: Tests

# WHY THIS FILE WAS REWRITTEN (2026-08-28)
#
# The previous version had five jobs and not one of them could run. Every job
# began `npm ci` at the repository root, and there is no package.json there —
# there never has been. It also ran `tests/e2e/`, which targets the PRE-ZOLA
# site (`/pricing.html`, `/about-us.html`) against a server rooted at the repo,
# so those paths stopped existing when the site moved to Zola. It had been red
# on `main` since 2026-08-23 and did not trigger on feature branches, which is
# where the work happens.
#
# The installable harness is `site/`: its own package.json, lockfile,
# playwright.config.js and 65 specs, serving itself with `zola serve`.
#
# TWO JOBS, ON PURPOSE — they take very different amounts of wall clock.
#
#   guards  runs on EVERY push. `zola build` plus the build-invariant script,
#           no browser. Measured on main: 0.4-0.5 min. It catches the class of bug that actually
#           shipped here: an image whose CSS filter layer is composited before
#           the image lands paints NOTHING, while `complete`, `naturalWidth`
#           and `checkVisibility()` all report it healthy. No DOM assertion can
#           see that, so `toBeVisible()` passes over an invisible logo.
#
#   e2e-green
#           The subset that actually passes, run on EVERY push. 52 tests, ~1
#           min. This is the job that gates.
#
#   e2e     The full Desktop-Chrome suite, SHARDED, workflow_dispatch ONLY.
#           Sizing took three attempts and two wrong assumptions, both recorded
#           so nobody repeats them:
#             1. Measured locally at 8.9 min and treated that as the CI cost —
#                but locally Playwright used up to 12 workers, and
#                playwright.config.js pins `workers: 1` under CI. 30-min
#                timeout, cancelled.
#             2. Assumed a private repo: 2-core runners and billed minutes, so
#                --workers=2 and a stingy cadence. Ran 61.8 min against a
#                60-min timeout, cancelled again. This repo is PUBLIC —
#                Actions minutes are free and unlimited, and public repos get
#                4-core runners.
#           So: 3 shards x 4 workers, 45-min budget.
#
# ⚠️ A CORRECTION TO WHAT THIS FILE USED TO SAY (2026-08-28).
#
# This header claimed the suite "passes 157/157 locally" and was therefore
# "MEASURED green". It does not and was not. Measured at HEAD on 2026-08-28,
# Desktop-Chrome is 306 tests: 189 passed, 116 FAILED, 1 skipped. The earlier
# figure was measuring something else. Do not restore that claim.
#
# Two systemic causes were then fixed, and the suite re-measured:
#
#   - 318 `waitForLoadState('networkidle')` waits across 44 files. That wait
#     cannot succeed here (Cloudflare Turnstile holds a blob: request open for
#     the life of the page), so each burned its full 30s before failing.
#     Now `domcontentloaded`, and pinned by scripts/check-spec-invariants.mjs.
#   - 55 hardcoded origins across 25 files pointing at 127.0.0.1:1025 and
#     :1027 while webServer serves :1111 — 133 ERR_CONNECTION_REFUSED. Those
#     tests were DEAD, not passing. Now relative, so baseURL governs.
#
# Result: 116 -> 86 failures, 189 -> 219 passing, 5.3m -> 4.1m, and ZERO
# regressions (the after failure-set is a strict subset of the before set,
# compared by test TITLE — comparing by file:line is invalid here, because
# adding a comment to each file shifts every line number and manufactures ~74
# phantom regressions).
#
# The remaining 86 are test ROT, not infrastructure: the specs assert an older
# site. The largest cluster is `locator('nav')` resolving to 3 elements where
# the test expects 1. Each needs a judgement call about what to assert now, so
# the full suite stays on-demand until that work is done.
#
# Ordering note for anyone changing this: the target suite was MEASURED green
# (157 passed, 1 skipped, 0 failed) before being made blocking. Pointing CI at
# an unverified suite is how every branch goes red at once.
#
# The root `tests/` tree and `playwright.config.ts` are left alone — a fossil
# of the pre-Zola site with no package.json to install. Retargeting them would
# mean standing up a second harness beside a working one. See
# `divinci-ai-site-ci-cannot-gate-anything` in the server repo's
# notes/KNOWN-GAPS.yaml.

on:
  push:
    branches: ['**']
    paths:
      - 'site/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  ZOLA_VERSION: '0.19.2'

jobs:
  guards:
    name: Build guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install Zola
        # Pinned rather than "latest": a silent Zola bump would change the
        # rendered HTML the guards assert against.
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin zola
          zola --version

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: zola build

      - name: Build invariants
        # Also runs in the deploy build chain, so this is a second line rather
        # than the only one.
        run: node scripts/check-build-invariants.mjs

      - name: Spec invariants
        # Source-level, so it needs no browser and no server. Currently pins
        # one rule: no spec may wait for `networkidle`. That wait cannot
        # succeed on this site and its failure mode is a 30s timeout, which
        # reads as slowness rather than as a bug — which is how 318 of them
        # accumulated across 44 files and kept this suite from gating.
        run: node scripts/check-spec-invariants.mjs

  e2e-green:
    name: E2E (green subset)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: guards
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin zola
          zola --version

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the green subset
        # ONE regex, not eight arguments: this Playwright version ANDs multiple
        # positional filters, so passing them separately matches nothing and
        # exits "No tests found" — which looks like a config error, not a
        # filter mistake.
        #
        # ⚠️ THIS LIST MUST BE DERIVED FROM A CI RUN, NOT A LOCAL ONE.
        # It first shipped with eight files, measured green twice consecutively
        # on a laptop — and went red on the very first CI run. www-rag-universe
        # passes locally and fails on a runner through all three attempts: its
        # canvas exists at full size but stays at `opacity: 0`, so the reveal
        # never happens. Whatever drives it does not run the same way headless.
        # The seven below are green IN CI (run 33223177232).
        #
        # To regenerate: dispatch the full `e2e` job and take the files with
        # zero failures from ITS results. A file measured green only locally is
        # not evidence about this job.
        run: |
          npx playwright test --project=Desktop-Chrome --workers=4 \
            "(debug-scroll|language-navigation-comprehensive|language-switcher-functionality|mobile-media|performance-assets|status-attribution|video-functionality)\.spec\.js"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-green
          path: site/test-results/
          retention-days: 7

  e2e-baseline:
    name: E2E (full suite vs baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: guards
    # BOOTSTRAP ONLY. There is no baseline yet, so this would fail every
    # push until one exists. Dispatch it, take playwright-results.json from
    # the run, generate the baseline from THAT, and remove this line in the
    # same commit that adds the file.
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin zola
          zola --version

      - name: Install dependencies
        run: npm ci

      - name: Harness unit tests
        # The baseline script decides whether this job is red. Test it first,
        # and before the 20-minute suite rather than after.
        run: node --test scripts/tests/e2e-baseline.test.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the full Desktop-Chrome suite
        # `|| true` because the suite HAS known failures — a non-zero exit here
        # is expected and is not the verdict. The verdict is the next step.
        # This does not hide a crash: the baseline script fails when the JSON
        # report is missing, unparseable, or holds fewer tests than the
        # baseline was built from.
        run: npx playwright test --project=Desktop-Chrome --workers=4 || true

      - name: Compare against the known-failure baseline
        run: node scripts/e2e-baseline.mjs --check

      - name: Upload the JSON report
        # Always: this is what you regenerate the baseline FROM, and it is the
        # only CI-derived source that may be used for that.
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-json-report
          path: site/playwright-results.json
          retention-days: 30

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-baseline
          path: site/test-results/
          retention-days: 7

  e2e:
    name: E2E ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: guards
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # ON-DEMAND ONLY, until the suite is CI-stable. See the note at the top:
    # 52 of the 65 spec files wait for `networkidle`, which never arrives on a
    # runner, so this fails deterministically — not flakily — in CI. Wiring it
    # to push or pull_request would paint main and every PR red on a
    # pre-existing condition, which is the exact failure this rewrite set out
    # to remove. Run it with `gh workflow run test.yml` while fixing specs.
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin zola
          zola --version

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E (Desktop-Chrome) shard ${{ matrix.shard }}/3
        # --workers overrides the config's CI value of 1 without editing a file
        # several people are working in. 4 workers because public-repo runners
        # are 4-core; the whole suite at 2 workers took 61.8 min and timed out.
        #
        # The Mobile-* and Visual-* projects are NOT enabled: they have not
        # been measured, and enabling an unmeasured project is the mistake this
        # rewrite exists to avoid. Mobile-Chrome is the one to measure next.
        run: npx playwright test --project=Desktop-Chrome --workers=4 --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: site/test-results/
          retention-days: 7
